        run: go test -race -count=1 -p 1 -coverprofile=coverage.out -covermode=atomic ./cmd/... ./internal/... ./tests/scenarios/...

      - name: Enforce 70 % coverage
        run: |
          COVERAGE=$(go tool cover -func=coverage.out | grep total | awk '{print $3}' | tr -d '%')
