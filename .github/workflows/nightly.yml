name: Nightly

# Full-stack nightly validation: no path filtering, every component, every check.
# Runs at 02:00 UTC daily. Also triggerable manually via workflow_dispatch.

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

concurrency:
  group: nightly
  cancel-in-progress: false

env:
  GO_VERSION: "1.25"
  PYTHON_VERSION: "3.12"

jobs:
  # ──────────────────────────────────────────────────────────────────────────
  # 1. test-all — full test suite, no path filtering
  # ──────────────────────────────────────────────────────────────────────────

  test-all:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: apiguard
            language: go
            working_dir: apiguard
            go_sum_path: apiguard/go.sum
          - component: citadel
            language: go
            working_dir: citadel
            go_sum_path: citadel/go.sum
          - component: irflow
            language: go
            working_dir: irflow
            go_sum_path: irflow/go.sum
          - component: nis2compass
            language: python
            working_dir: nis2compass

    name: "test-all (${{ matrix.component }})"

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: ${{ matrix.component }}_test
          POSTGRES_USER: ${{ matrix.component }}
          POSTGRES_PASSWORD: ${{ matrix.component }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ${{ matrix.component }} -d ${{ matrix.component }}_test" --health-interval 10s
          --health-timeout 5s --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping" --health-interval 10s
          --health-timeout 5s --health-retries 5

    defaults:
      run:
        working-directory: ${{ matrix.working_dir }}

    steps:
      - uses: actions/checkout@v4

      # --- Go setup (apiguard, citadel) ---
      - name: Setup Go
        if: matrix.language == 'go'
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: ${{ matrix.go_sum_path }}

      - name: Go tests (race detector, 15m timeout)
        if: matrix.language == 'go'
        env:
          DATABASE_URL: postgres://${{ matrix.component }}:${{ matrix.component }}@localhost:5432/${{ matrix.component }}_test?sslmode=disable
        run: go test -race -count=1 -timeout=15m ./...

      # --- Python setup (nis2compass) ---
      - name: Setup Python
        if: matrix.language == 'python'
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: nis2compass/requirements*.txt

      - name: Install Python dependencies
        if: matrix.language == 'python'
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Run migrations
        if: matrix.language == 'python'
        env:
          # alembic (nis2compass/migrations/env.py) reads NIS2_DB_* components,
          # not DATABASE_URL — it does not exist as a config knob for this app.
          NIS2_DB_HOST: localhost
          NIS2_DB_PORT: "5432"
          NIS2_DB_USER: nis2compass
          NIS2_DB_PASSWORD: nis2compass
          NIS2_DB_NAME: nis2compass_test
        run: alembic upgrade head

      - name: Pytest (300s timeout)
        if: matrix.language == 'python'
        env:
          # The Flask app (app/config.py) reads NIS2_DB_URL (and refuses to start
          # without it or NIS2_DB_PASSWORD), while tests/conftest.py overrides the
          # DB via NIS2_TEST_DB_URL and Redis via NIS2_TEST_REDIS_URL. DATABASE_URL
          # and REDIS_URL are not read anywhere in this app.
          NIS2_DB_URL: postgresql+psycopg2://nis2compass:nis2compass@localhost:5432/nis2compass_test
          NIS2_TEST_DB_URL: postgresql+psycopg2://nis2compass:nis2compass@localhost:5432/nis2compass_test
          NIS2_REDIS_URL: redis://localhost:6379/0
          NIS2_TEST_REDIS_URL: redis://localhost:6379/0
          NIS2_SECRET_KEY: nightly-secret
          NIS2_JWT_SECRET: nightly-jwt-secret-at-least-32-chars-long
          NIS2_ENV: testing
        run: pytest tests/ -v --timeout=300

  # ──────────────────────────────────────────────────────────────────────────
  # 1b. SDK tests — Go SDK, Python SDK, vantage-hash (Rust)
  # ──────────────────────────────────────────────────────────────────────────

  test-sdks:
    runs-on: ubuntu-latest
    name: "test-all (sdks)"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            sdk/vantage-hash
            sdk/rust

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: sdk/typescript/package-lock.json

      - name: Go SDK tests
        working-directory: sdk/go
        run: go test -race -count=1 -timeout=15m ./...

      - name: Python SDK tests
        working-directory: sdk/python
        run: |
          pip install -r requirements.txt -r requirements-dev.txt
          pytest tests/ -v

      - name: TypeScript SDK tests
        working-directory: sdk/typescript
        run: |
          npm ci
          npm test

      - name: vantage-hash tests (Rust)
        working-directory: sdk/vantage-hash
        run: cargo test --all-features

      - name: Rust SDK tests
        # Deliberately not --all-features: the "integration" feature lifts
        # #[cfg_attr(not(feature = "integration"), ignore)] off
        # tests/integration_tests.rs, and this job has no mock API server -
        # see .github/workflows/sdk.yml's test-rust-sdk job for the same fix.
        working-directory: sdk/rust
        run: cargo test --features axum,tracing-subscriber

  # ──────────────────────────────────────────────────────────────────────────
  # 2. dependency-audit — parallel with test-all
  # ──────────────────────────────────────────────────────────────────────────

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # --- Go vulncheck ---
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: govulncheck — apiguard
        working-directory: apiguard
        run: govulncheck ./...

      - name: govulncheck — citadel
        working-directory: citadel
        run: govulncheck ./...

      - name: govulncheck — IRFlow
        working-directory: irflow
        run: govulncheck ./...

      - name: govulncheck — Go SDK
        working-directory: sdk/go
        run: govulncheck ./...

      # --- Python audit ---
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install pip-audit
        run: pip install pip-audit

      - name: pip-audit — nis2compass
        run: pip-audit -r nis2compass/requirements.txt

      - name: pip-audit — Python SDK
        run: |
          if [ -f sdk/python/requirements.txt ]; then
            pip-audit -r sdk/python/requirements.txt
          else
            pip-audit --requirement <(pip install sdk/python/ --dry-run --report - \
              | python3 -c "import sys,json; [print(f'{p[\"metadata\"][\"name\"]}=={p[\"metadata\"][\"version\"]}') for p in json.load(sys.stdin)[\"install\"]]") \
              || echo "::warning::Could not audit Python SDK via pyproject.toml"
          fi

      # --- Rust audit ---
      - uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-audit
        run: cargo install cargo-audit --quiet

      - name: cargo audit — vantage-hash
        working-directory: sdk/vantage-hash
        run: cargo audit

      - name: cargo audit — Rust SDK
        working-directory: sdk/rust
        run: cargo audit

  # ──────────────────────────────────────────────────────────────────────────
  # 3. dast — needs test-all to pass
  # ──────────────────────────────────────────────────────────────────────────

  dast:
    needs: [test-all, test-sdks]
    runs-on: ubuntu-latest
    permissions:
      packages: read
    steps:
      - uses: actions/checkout@v4

      # go install (below, for nuclei) puts the binary in $(go env GOPATH)/bin,
      # which is only on PATH because setup-go adds it — unlike
      # dependency-audit/worm-integrity, this job was missing this step, so
      # the preinstalled runner Go could `go install` nuclei but the shell
      # could never find it afterward ("nuclei: command not found", exit 127).
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      # Building ~13 Go/Rust/Python Dockerfiles from scratch (fresh runner,
      # no layer cache) can itself take several minutes. Split this out from
      # `up --wait` so a build failure is reported as a build failure, not
      # folded into a "timeout waiting for dependencies" from the next step.
      - name: Build stack images
        run: docker compose -f deploy/docker-compose.dev.yml build --parallel

      # wait-timeout must cover more than raw startup: apiguard-api and
      # citadel-api healthchecks alone allow up to retries(30) * interval(5s)
      # = 150s to go healthy, and dependants (e.g. apiguard-api waiting on
      # both citadel-api and sinauth-api) stack those budgets across the
      # dependency chain. 120s was never enough even with images pre-built.
      - name: Start full stack
        run: docker compose -f deploy/docker-compose.dev.yml up -d --wait --wait-timeout 600

      # --retry-all-errors covers transient connection resets/empty replies
      # during container startup (e.g. Air still compiling the dev binary)
      # that curl's default retry policy does not retry on its own — see
      # apiguard-api / citadel-api healthchecks in docker-compose.dev.yml
      # for the primary fix (compose now waits for the app to actually
      # serve, not just for the container to be running); this is a
      # defense-in-depth backstop for any remaining transient blips.
      - name: Wait for APIGuard health endpoint
        run: |
          curl -sf --retry-all-errors --retry 15 --retry-delay 5 --retry-connrefused \
            http://localhost:8080/api/v1/health

      # NIS2 Compass registers its health blueprint without the /api/v1
      # prefix used by every other route (see
      # nis2compass/app/api/__init__.py) and only listens on 8090 (see
      # docker-compose.dev.yml) — there is no service on port 5000.
      - name: Wait for NIS2 Compass health endpoint
        run: |
          curl -sf --retry-all-errors --retry 15 --retry-delay 5 --retry-connrefused \
            http://localhost:8090/health

      # Citadel's health route is /api/v1/health (see
      # citadel/internal/api/server.go) on port 8099 (see
      # docker-compose.dev.yml) — there is no service on port 9000.
      - name: Wait for Citadel health endpoint
        run: |
          curl -sf --retry-all-errors --retry 15 --retry-delay 5 --retry-connrefused \
            http://localhost:8099/api/v1/health

      - name: Install Nuclei
        run: |
          go install github.com/projectdiscovery/nuclei/v3/cmd/nuclei@latest
          nuclei -update-templates -silent

      - name: DAST — APIGuard
        run: |
          nuclei -u http://localhost:8080 \
            -tags api,owasp \
            -jsonl -output dast-apiguard.jsonl \
            -severity medium,high,critical || true

      - name: DAST — NIS2 Compass
        run: |
          nuclei -u http://localhost:8090 \
            -tags api,owasp \
            -jsonl -output dast-nis2compass.jsonl \
            -severity medium,high,critical || true

      - name: DAST — Citadel
        run: |
          nuclei -u http://localhost:8099 \
            -tags api \
            -jsonl -output dast-citadel.jsonl \
            -severity medium,high,critical || true

      - name: Fail if CRITICAL findings found
        run: |
          failed=0
          for f in dast-*.jsonl; do
            [ ! -f "$f" ] && continue
            if grep -q '"severity":"critical"' "$f" 2>/dev/null; then
              echo "::error::Critical DAST finding in ${f}"
              cat "$f"
              failed=1
            fi
          done
          [ "$failed" -eq 1 ] && exit 1
          echo "No critical DAST findings."

      - name: Collect container logs on failure
        if: failure()
        run: docker compose -f deploy/docker-compose.dev.yml logs --no-color > stack-logs.txt

      - name: Upload DAST results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nightly-dast-results
          path: |
            dast-*.jsonl
            stack-logs.txt

      - name: Tear down stack
        if: always()
        run: docker compose -f deploy/docker-compose.dev.yml down -v

  # ──────────────────────────────────────────────────────────────────────────
  # 4. worm-integrity — parallel with dast (does not need test-all)
  # ──────────────────────────────────────────────────────────────────────────

  worm-integrity:
    needs: [test-all, test-sdks]
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: citadel_worm
          POSTGRES_USER: citadel
          POSTGRES_PASSWORD: citadel
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U citadel -d citadel_worm" --health-interval 10s
          --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: citadel/go.sum

      - name: Run CITADEL migrations
        env:
          DATABASE_URL: postgres://citadel:citadel@localhost:5432/citadel_worm?sslmode=disable
        working-directory: citadel
        run: |
          go install -tags 'postgres' github.com/golang-migrate/migrate/v4/cmd/migrate@latest
          migrate -path migrations -database "$DATABASE_URL" up

      - name: Verify WORM chain integrity
        env:
          DATABASE_URL: postgres://citadel:citadel@localhost:5432/citadel_worm?sslmode=disable
        working-directory: citadel
        run: go test -tags integration -run TestWORM_Integration_ChainVerification -v -count=1 -timeout=10m ./internal/api/handlers/...

  # ──────────────────────────────────────────────────────────────────────────
  # 5. notify-on-failure — open a GitHub Issue when any job fails
  # ──────────────────────────────────────────────────────────────────────────

  notify-on-failure:
    needs:
      - test-all
      - test-sdks
      - dependency-audit
      - dast
      - worm-integrity
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/github-script@v9
        with:
          script: |
            const date = new Date().toISOString().slice(0, 10);
            const title = `Nightly CI failure — ${date}`;

            // Check for an existing open issue with the same title
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'ci-failure,nightly',
              per_page: 100
            });

            const duplicate = existing.data.find(i => i.title === title);
            if (duplicate) {
              core.info(`Issue already exists: #${duplicate.number} — skipping creation.`);
              return;
            }

            // Determine which jobs failed
            const needs = ${{ toJSON(needs) }};
            const failedJobs = Object.entries(needs)
              .filter(([_, v]) => v.result === 'failure')
              .map(([k, _]) => k);

            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

            const body = [
              `## Nightly CI failure — ${date}`,
              '',
              'One or more nightly jobs failed.',
              '',
              `**Failed jobs:** ${failedJobs.length > 0 ? failedJobs.join(', ') : '_could not determine_'}`,
              '',
              `**Workflow run:** ${runUrl}`,
              '',
              `cc @${context.repo.owner}`
            ].join('\n');

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: title,
              body: body,
              labels: ['ci-failure', 'nightly']
            });

            core.info(`Created issue: "${title}"`);
