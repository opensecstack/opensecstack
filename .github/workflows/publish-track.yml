name: Publish Track Lab Images

on:
  push:
    branches:
      - main
    paths:
      - "cyberpath/content/tracks/**"
  workflow_dispatch:
    inputs:
      track:
        description: "Track slug to rebuild (e.g. 02-phishing-recognition) or 'all'"
        required: true
        default: "all"

permissions:
  contents: write
  packages: write
  id-token: write

# ---------------------------------------------------------------------------
# Detect which tracks changed (or use the manual override)
# ---------------------------------------------------------------------------
jobs:
  detect-tracks:
    name: Detect changed tracks
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # HEAD~1 HEAD (the old range) only ever diffs the single most
          # recent commit. A push that lands more than one commit at once
          # (a merge commit, or several direct commits) silently dropped
          # every track changed by the earlier commits. Comparing
          # github.event.before/after instead covers the whole push, and
          # that range can span arbitrarily far back, so fetch full history.
          fetch-depth: 0

      - name: Build track matrix
        id: set-matrix
        shell: bash
        run: |
          ALL_TRACKS=(
            "01-nis2-awareness"
            "02-phishing-recognition"
            "03-secure-coding"
            "04-incident-response"
            "05-api-security"
            "06-threat-intelligence"
            "07-linux-hardening"
            "08-network-forensics"
          )

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            INPUT="${{ github.event.inputs.track }}"
            if [[ "$INPUT" == "all" ]]; then
              TRACKS=("${ALL_TRACKS[@]}")
            else
              TRACKS=("$INPUT")
            fi
          else
            BEFORE="${{ github.event.before }}"
            AFTER="${{ github.event.after }}"
            # All-zeros `before` means there's no prior commit to diff
            # against (e.g. the branch's first push) — fall back to git's
            # well-known empty-tree hash as the diff root.
            if [[ "$BEFORE" =~ ^0+$ ]]; then
              BEFORE=$(git hash-object -t tree /dev/null)
            fi
            CHANGED=$(git diff --name-only "$BEFORE" "$AFTER" -- 'cyberpath/content/tracks/' \
              | grep -oP 'cyberpath/content/tracks/\K[^/]+' \
              | sort -u)
            TRACKS=()
            for t in $CHANGED; do
              TRACKS+=("$t")
            done
          fi

          if [[ ${#TRACKS[@]} -eq 0 ]]; then
            echo "matrix={\"track\":[]}" >> "$GITHUB_OUTPUT"
          else
            JSON=$(printf '%s\n' "${TRACKS[@]}" | jq -R . | jq -sc '{track: .}')
            echo "matrix=$JSON" >> "$GITHUB_OUTPUT"
          fi

# ---------------------------------------------------------------------------
# Build, push, sign, attest, and update digest for each changed track
# ---------------------------------------------------------------------------
  publish:
    name: "Publish ${{ matrix.track }}"
    needs: detect-tracks
    if: ${{ fromJson(needs.detect-tracks.outputs.matrix).track[0] != null }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.detect-tracks.outputs.matrix) }}

    steps:
      # -----------------------------------------------------------------------
      # Setup
      # -----------------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Install syft (for SBOM generation)
        uses: anchore/sbom-action/download-syft@v0

      - name: Install crane
        uses: imjasonh/setup-crane@v0.4

      # -----------------------------------------------------------------------
      # Resolve lab metadata from lab.yaml
      # -----------------------------------------------------------------------
      - name: Read lab metadata
        id: meta
        shell: bash
        run: |
          TRACK="${{ matrix.track }}"
          TRACK_DIR="cyberpath/content/tracks/${TRACK}"

          # Find the single lab directory under this track
          LAB_DIR=$(find "${TRACK_DIR}/labs" -mindepth 1 -maxdepth 1 -type d | head -n 1)
          if [[ -z "$LAB_DIR" ]]; then
            echo "ERROR: No lab directory found under ${TRACK_DIR}/labs" >&2
            exit 1
          fi

          LAB_YAML="${LAB_DIR}/lab.yaml"
          if [[ ! -f "$LAB_YAML" ]]; then
            echo "ERROR: lab.yaml not found at ${LAB_YAML}" >&2
            exit 1
          fi

          # Strip a leading UTF-8 BOM and any CRLF line endings before
          # parsing. A lab.yaml saved by Windows tooling (e.g. PowerShell
          # Out-File/Set-Content without -Encoding utf8) can carry both, and
          # the BOM alone is enough to break the `^id:` anchor on line 1 -
          # which, combined with this shell's `set -e -o pipefail`, used to
          # kill this step with a bare "exit code 1" and no diagnostic at
          # all (the grep failure aborted the script before the explicit
          # error-handling below ever ran). `|| true` on each grep|awk
          # pipeline defeats that so the emptiness check below can actually
          # report what went wrong.
          NORMALIZED=$(sed '1s/^\xef\xbb\xbf//' "$LAB_YAML" | tr -d '\r')

          LAB_ID=$(grep -m1 '^id:' <<< "$NORMALIZED" | awk '{print $2}' || true)
          VERSION=$(grep -m1 '^version:' <<< "$NORMALIZED" | awk '{print $2}' || true)
          IMAGE_REF=$(grep -m1 '^image:' <<< "$NORMALIZED" | awk '{print $2}' | tr -d '"' || true)

          if [[ -z "$LAB_ID" || -z "$VERSION" || -z "$IMAGE_REF" ]]; then
            echo "ERROR: could not parse id/version/image from ${LAB_YAML} (lab_id='${LAB_ID}' version='${VERSION}' image_ref='${IMAGE_REF}')" >&2
            exit 1
          fi

          echo "lab_id=${LAB_ID}"        >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}"      >> "$GITHUB_OUTPUT"
          echo "image_ref=${IMAGE_REF}"  >> "$GITHUB_OUTPUT"
          echo "lab_dir=${LAB_DIR}"      >> "$GITHUB_OUTPUT"
          echo "dockerfile=${LAB_DIR}/Dockerfile" >> "$GITHUB_OUTPUT"

          echo "Track   : ${TRACK}"
          echo "Lab ID  : ${LAB_ID}"
          echo "Version : ${VERSION}"
          echo "Image   : ${IMAGE_REF}"

          # Several tracks only have lab.yaml authored so far — no Dockerfile,
          # no compiled lab payload behind it yet. Others (e.g.
          # phishing-detector) ship a Dockerfile that itself documents an
          # unimplemented build step (a lab.wasm.placeholder standing in for
          # a real lab.wasm the "track build process" is supposed to produce
          # but nothing in this repo actually runs). Treat both as "not
          # ready yet" rather than a hard CI failure: warn and skip the rest
          # of this leg so a push to main isn't blocked on lab content that
          # simply hasn't been authored.
          DOCKERFILE="${LAB_DIR}/Dockerfile"
          READY=true
          REASON=""

          if [[ ! -f "$DOCKERFILE" ]]; then
            READY=false
            REASON="no Dockerfile at ${DOCKERFILE}"
          else
            # Only handles single-source `COPY <src> <dest>` lines, which is
            # this repo's convention for these scratch-image lab Dockerfiles
            # — not a general Dockerfile parser. Plain awk field-splitting
            # (not grep -P) deliberately, so this doesn't depend on the
            # runner's locale supporting PCRE — that broke silently in local
            # testing under a non-UTF8 locale, which would have made this
            # check falsely report "ready" instead of catching a missing
            # build input.
            MISSING=()
            while read -r src; do
              [[ -z "$src" ]] && continue
              if [[ ! -e "${LAB_DIR}/${src}" ]]; then
                MISSING+=("$src")
              fi
            done < <(awk '$1=="COPY" && $2 !~ /^--from=/ {print $2}' "$DOCKERFILE")

            if [[ ${#MISSING[@]} -gt 0 ]]; then
              READY=false
              REASON="Dockerfile references missing build input(s): ${MISSING[*]}"
            fi
          fi

          echo "ready=${READY}" >> "$GITHUB_OUTPUT"

          if [[ "$READY" == "false" ]]; then
            echo "::warning::Skipping publish for ${TRACK} (${LAB_ID}) — ${REASON}. This lab's content isn't ready to publish yet."
          fi

      # -----------------------------------------------------------------------
      # Authenticate to ghcr.io
      # -----------------------------------------------------------------------
      - name: Log in to ghcr.io
        if: steps.meta.outputs.ready == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # -----------------------------------------------------------------------
      # Build and push the lab image
      # -----------------------------------------------------------------------
      - name: Build and push lab image
        id: build
        if: steps.meta.outputs.ready == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ${{ steps.meta.outputs.lab_dir }}
          file: ${{ steps.meta.outputs.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.image_ref }}
          provenance: false
          sbom: false

      # -----------------------------------------------------------------------
      # Keyless OIDC signing (Sigstore / Rekor)
      # -----------------------------------------------------------------------
      - name: Sign image with cosign (keyless OIDC)
        if: steps.meta.outputs.ready == 'true'
        shell: bash
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: |
          IMAGE_DIGEST="${{ steps.meta.outputs.image_ref }}@${{ steps.build.outputs.digest }}"
          cosign sign --yes "${IMAGE_DIGEST}"

      # -----------------------------------------------------------------------
      # CycloneDX SBOM generation and attestation
      # -----------------------------------------------------------------------
      - name: Generate CycloneDX SBOM with syft
        if: steps.meta.outputs.ready == 'true'
        shell: bash
        run: |
          IMAGE_DIGEST="${{ steps.meta.outputs.image_ref }}@${{ steps.build.outputs.digest }}"
          syft "${IMAGE_DIGEST}" -o cyclonedx-json > sbom.cdx.json

      - name: Attest SBOM with cosign
        if: steps.meta.outputs.ready == 'true'
        shell: bash
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: |
          IMAGE_DIGEST="${{ steps.meta.outputs.image_ref }}@${{ steps.build.outputs.digest }}"
          cosign attest --yes \
            --type cyclonedx \
            --predicate sbom.cdx.json \
            "${IMAGE_DIGEST}"

      # -----------------------------------------------------------------------
      # Resolve the authoritative SHA-256 digest via crane and stamp labs.yaml
      # -----------------------------------------------------------------------
      - name: Resolve canonical digest
        id: digest
        if: steps.meta.outputs.ready == 'true'
        shell: bash
        run: |
          DIGEST=$(crane digest "${{ steps.meta.outputs.image_ref }}")
          echo "value=${DIGEST}" >> "$GITHUB_OUTPUT"
          echo "Digest: ${DIGEST}"

      - name: Stamp digest into labs/labs.yaml
        if: steps.meta.outputs.ready == 'true'
        shell: bash
        env:
          LAB_ID: ${{ steps.meta.outputs.lab_id }}
          DIGEST: ${{ steps.digest.outputs.value }}
          LABS_YAML: cyberpath/labs/labs.yaml
        run: |
          # A quoted heredoc terminator ('PYEOF') disables shell expansion
          # inside it, so $LAB_ID/$DIGEST/$LABS_YAML used to reach Python as
          # the four literal characters "$LAB_ID" etc., not the real values -
          # open("$LABS_YAML") always raised FileNotFoundError. Reading them
          # from the environment instead sidesteps that shell-quoting pitfall
          # entirely (and one less thing to escape if a digest ever contains
          # a shell-special character).
          python3 - <<'PYEOF'
          import os, sys, re

          lab_id = os.environ["LAB_ID"]
          digest = os.environ["DIGEST"]
          path   = os.environ["LABS_YAML"]

          with open(path, "r") as fh:
              content = fh.read()

          # Match the block for this lab_id and replace its digest line.
          # Pattern: after "  - id: <lab_id>" (anywhere in block), replace
          # the next "    digest: ..." line.
          pattern = (
              r'(  - id: ' + re.escape(lab_id) + r'(?:\n(?!  - id:)[^\n]*)*?\n'
              r'    digest: )"[^"]*"'
          )
          replacement = r'\g<1>"' + digest + r'"'
          updated, n = re.subn(pattern, replacement, content, count=1, flags=re.DOTALL)

          if n == 0:
              sys.exit(f"ERROR: could not locate digest field for lab '{lab_id}' in {path}")

          # Also flip cosign_verified to true now that we have just signed it.
          pattern_cv = (
              r'(  - id: ' + re.escape(lab_id) + r'(?:\n(?!  - id:)[^\n]*)*?\n'
              r'    cosign_verified: )false'
          )
          updated, _ = re.subn(pattern_cv, r'\g<1>true', updated, count=1, flags=re.DOTALL)

          with open(path, "w") as fh:
              fh.write(updated)

          print(f"Stamped digest for '{lab_id}': {digest}")
          PYEOF

      # -----------------------------------------------------------------------
      # Commit the updated labs/labs.yaml back to main
      # -----------------------------------------------------------------------
      - name: Commit updated labs.yaml
        if: steps.meta.outputs.ready == 'true'
        shell: bash
        env:
          LAB_ID: ${{ steps.meta.outputs.lab_id }}
          VERSION: ${{ steps.meta.outputs.version }}
          IMAGE_REF: ${{ steps.meta.outputs.image_ref }}
          DIGEST: ${{ steps.digest.outputs.value }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add cyberpath/labs/labs.yaml

          if git diff --cached --quiet; then
            echo "No changes to labs.yaml — skipping commit."
          else
            MSG="chore(labs): stamp digest for ${LAB_ID} [${VERSION}]"$'\n\n'"Automated by publish-track.yml after successful push + cosign sign + SBOM attestation."$'\n'"Image: ${IMAGE_REF}@${DIGEST}"
            git commit -m "$MSG"

            # Each matrix leg (one per changed track) reaches this step
            # independently and in parallel. A single pull --rebase + push
            # only survives if no other leg pushes in between; with several
            # tracks changing in the same run, the second leg to arrive gets
            # a non-fast-forward rejection and — with no retry — silently
            # drops its digest stamp from this run. Rebase-and-retry instead.
            MAX_ATTEMPTS=5
            attempt=1
            until git push origin main; do
              if [[ "$attempt" -ge "$MAX_ATTEMPTS" ]]; then
                echo "::error::git push origin main failed after ${MAX_ATTEMPTS} attempts (labs.yaml digest stamp for ${LAB_ID} was not published)"
                exit 1
              fi
              echo "push rejected (attempt ${attempt}/${MAX_ATTEMPTS}) — rebasing onto origin/main and retrying..."
              sleep "$((RANDOM % 5 + 1))"
              git fetch origin main
              git rebase origin/main
              attempt=$((attempt + 1))
            done
          fi
