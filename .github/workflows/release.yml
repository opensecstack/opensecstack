name: Release

on:
  push:
    tags:
      # Per docs/release-process.md, this workflow builds and publishes
      # all four platforms together plus the SDKs under one shared version
      # stamp - that's the documented "ecosystem release" (e.g.
      # ecosystem/v1.0.0-2026-Q2), not a per-platform release (those are
      # tagged citadel/v1.1.0, apiguard/v1.3.0, etc. and don't start with
      # "v" at all). A bare "v*" trigger could never match either real
      # convention.
      - "ecosystem/v*"
    # TEMPORARY: verifying the .citadel / ecosystem/v* tag fixes without
    # waiting for a real tag. resolve-release-mode below forces every
    # branches: push run into dry-run regardless of this trigger, so it
    # cannot actually push images or publish packages. Remove this
    # `branches: [main]` block once verified.
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run -- build and test but do not push or release"
        required: false
        default: false
        type: boolean

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  GO_VERSION: "1.24"
  PYTHON_VERSION: "3.12"
  REGISTRY: ghcr.io

# ---------------------------------------------------------------------------
# 0. Resolve release mode — the one place that decides whether this run is
#    allowed to actually push images / publish packages / cut a release.
# ---------------------------------------------------------------------------
jobs:
  resolve-release-mode:
    name: Resolve release mode
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.mode.outputs.publish }}
    steps:
      - name: Determine whether this run should actually publish
        id: mode
        run: |
          # Real releases only ever come from a genuine ecosystem/v* tag
          # push, or an explicit workflow_dispatch with dry_run=false. Every
          # other trigger — including the temporary `branches: [main]` push
          # trigger above — is forced into dry-run so it can exercise the
          # whole pipeline without pushing/publishing/releasing anything for
          # real.
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            if [[ "${{ inputs.dry_run }}" == "true" ]]; then
              PUBLISH=false
            else
              PUBLISH=true
            fi
          elif [[ "${{ github.ref }}" == refs/tags/ecosystem/v* ]]; then
            PUBLISH=true
          else
            PUBLISH=false
          fi
          echo "publish=${PUBLISH}" >> "$GITHUB_OUTPUT"
          echo "This run will $([ "$PUBLISH" = "true" ] && echo "PUBLISH FOR REAL" || echo "run as a DRY RUN — no push/publish/release")."

# ---------------------------------------------------------------------------
# 1. Parallel test stage (5 jobs running simultaneously)
# ---------------------------------------------------------------------------
  test-apiguard:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apiguard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: apiguard/go.sum
      - name: Run tests
        run: go test -race -count=1 ./...

  test-nis2compass:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nis2compass
    # nis2compass/app/config.py refuses to start without a DB password/URL,
    # and its tests need an actual schema to run migrations against. This
    # job had none of that wired up at all (no services, no migrations, no
    # env vars) — nightly.yml's nis2compass matrix leg already solves this
    # exact problem; mirrored that setup here instead of re-deriving it.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: nis2compass_test
          POSTGRES_USER: nis2compass
          POSTGRES_PASSWORD: nis2compass
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nis2compass -d nis2compass_test" --health-interval 10s
          --health-timeout 5s --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping" --health-interval 10s
          --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: nis2compass/requirements*.txt
      - name: Install dependencies
        # requirements.txt alone doesn't include pytest — it's a runtime-only
        # dependency list. The "pytest: command not found" failure this
        # produced is exactly why nightly.yml's equivalent step already
        # installs both files; this job just never got the same fix.
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Run migrations
        # alembic (nis2compass/migrations/env.py) reads NIS2_DB_* components,
        # not a single DATABASE_URL/NIS2_DB_URL — see nightly.yml for the
        # same note against the same code path.
        env:
          NIS2_DB_HOST: localhost
          NIS2_DB_PORT: "5432"
          NIS2_DB_USER: nis2compass
          NIS2_DB_PASSWORD: nis2compass
          NIS2_DB_NAME: nis2compass_test
        run: alembic upgrade head

      - name: Run tests
        # app/config.py reads NIS2_DB_URL (and refuses to start without it
        # or NIS2_DB_PASSWORD — the exact error this job was hitting);
        # tests/conftest.py overrides the DB via NIS2_TEST_DB_URL and Redis
        # via NIS2_TEST_REDIS_URL.
        env:
          NIS2_DB_URL: postgresql+psycopg2://nis2compass:nis2compass@localhost:5432/nis2compass_test
          NIS2_TEST_DB_URL: postgresql+psycopg2://nis2compass:nis2compass@localhost:5432/nis2compass_test
          NIS2_REDIS_URL: redis://localhost:6379/0
          NIS2_TEST_REDIS_URL: redis://localhost:6379/0
          NIS2_SECRET_KEY: release-ci-secret
          NIS2_JWT_SECRET: release-ci-jwt-secret-at-least-32-chars-long
          NIS2_ENV: testing
        run: pytest tests/ --timeout=300

  test-citadel:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: citadel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: citadel/go.sum
      - name: Run tests
        run: go test -race -count=1 ./...

  test-irflow:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: irflow
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: irflow/go.sum
      - name: Run tests
        run: go test -race -count=1 ./...

  test-vantage-hash:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk/vantage-hash
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Run tests
        run: cargo test

  test-sdk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Go SDK tests
        working-directory: sdk/go
        run: go test -race -count=1 ./...
      - name: Python SDK tests
        working-directory: sdk/python
        run: |
          # requirements.txt alone (runtime deps only, plus a bare pytest
          # install) is missing the test-only deps the suite actually
          # imports: responses, pytest_asyncio, respx (see
          # requirements-dev.txt / pyproject.toml's [dev] extra). That
          # produced 4 collection errors and exit code 2 with the old
          # `pip install -r requirements.txt` + `pip install pytest`.
          pip install -r requirements.txt -r requirements-dev.txt
          pytest tests/

  test-typescript-sdk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk/typescript
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: sdk/typescript/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm test

  # ---------------------------------------------------------------------------
  # 1b. Test jobs for the 7 previously-unreleased platforms joining the
  #     ecosystem release matrix for the first time. Each mirrors whatever
  #     infra ci.yml's equivalent test-<platform> job already proves is
  #     necessary (Postgres, migrations, etc.) rather than guessing.
  # ---------------------------------------------------------------------------
  test-openscrub:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: openscrub
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: openscrub_test
          POSTGRES_USER: openscrub
          POSTGRES_PASSWORD: openscrub
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: openscrub/go.sum

      - name: Run migrations
        env:
          DATABASE_URL: postgres://openscrub:openscrub@localhost:5432/openscrub_test?sslmode=disable
        run: |
          go install -tags 'postgres' github.com/golang-migrate/migrate/v4/cmd/migrate@latest
          migrate -path migrations -database "$DATABASE_URL" up

      - name: Go tests
        env:
          OPENSCRUB_TEST_DB_URL: postgres://openscrub:openscrub@localhost:5432/openscrub_test?sslmode=disable
        # Scoped to cmd/.../internal/..., matching ci.yml: tests/integration
        # needs a live server on :8087, out of scope here.
        run: go test -race -count=1 -tags=integration ./cmd/... ./internal/...

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Aya/eBPF build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang llvm libelf-dev zlib1g-dev pkg-config

      - name: Rust dataplane tests
        working-directory: openscrub/rust/dataplane
        run: cargo test

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: openscrub/web/package-lock.json

      - name: Install web dependencies
        working-directory: openscrub/web
        run: npm ci

      - name: Web tests
        working-directory: openscrub/web
        run: npm test

  test-sinauth:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sinauth
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: sinauth_test
          POSTGRES_USER: sinauth
          POSTGRES_PASSWORD: sinauth
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: sinauth/go.sum

      - name: Run migrations
        # sinauth ships its own `sinauth migrate` command (cmd/sinauth), which
        # applies plain-numbered .sql files, not golang-migrate's up/down
        # convention. config.Load() requires SINAUTH_ISSUER/SIGNING_KEY_PATH
        # to be non-empty even though migrate never uses them.
        env:
          SINAUTH_DB_URL: postgres://sinauth:sinauth@localhost:5432/sinauth_test?sslmode=disable
          SINAUTH_ISSUER: http://localhost:8100
          SINAUTH_SIGNING_KEY_PATH: /tmp/sinauth-ci-signing-key.pem
        run: go run ./cmd/sinauth migrate --dir migrations

      - name: Run tests
        env:
          SINAUTH_TEST_DB_URL: postgres://sinauth:sinauth@localhost:5432/sinauth_test?sslmode=disable
        run: go test -race -count=1 -tags=integration ./...

  test-threatflow:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: threatflow
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: threatflow_test
          POSTGRES_USER: threatflow
          POSTGRES_PASSWORD: threatflow
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: threatflow/go.sum
      - name: Run tests
        env:
          DATABASE_URL: postgres://threatflow:threatflow@localhost:5432/threatflow_test?sslmode=disable
          THREATFLOW_TEST_DB_URL: postgres://threatflow:threatflow@localhost:5432/threatflow_test?sslmode=disable
        # -p 1: internal/db/store and internal/correlate integration tests
        # both truncate/seed the same live database; running those packages'
        # test binaries in parallel races on shared state.
        run: go test -race -count=1 -tags=integration -p 1 ./...

  test-opencsirt:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: opencsirt
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: opencsirt_test
          POSTGRES_USER: opencsirt
          POSTGRES_PASSWORD: opencsirt
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: opencsirt/go.sum

      - name: Run migrations
        env:
          DATABASE_URL: postgres://opencsirt:opencsirt@localhost:5432/opencsirt_test?sslmode=disable
        run: |
          go install -tags 'postgres' github.com/golang-migrate/migrate/v4/cmd/migrate@latest
          migrate -path migrations -database "$DATABASE_URL" up

      - name: Run tests
        env:
          DATABASE_URL: postgres://opencsirt:opencsirt@localhost:5432/opencsirt_test?sslmode=disable
        # tests/integration needs a running server + Python advisory service
        # -- out of scope here, same exclusion ci.yml's job makes.
        run: go test -race -count=1 ./cmd/... ./internal/...

  test-cyberpath:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cyberpath
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: cyberpath_test
          POSTGRES_USER: cyberpath
          POSTGRES_PASSWORD: cyberpath
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: cyberpath/go.sum

      - name: Run migrations
        # cyberpath has no migration tool wired up yet -- its .sql files are
        # idempotent, forward-only DDL, applied in order via psql, same
        # approach ci.yml's test-cyberpath job uses.
        env:
          PGPASSWORD: cyberpath
        run: |
          for f in internal/db/migrations/*.sql; do
            psql -h localhost -U cyberpath -d cyberpath_test -v ON_ERROR_STOP=1 -f "$f"
          done

      - name: Run tests
        env:
          CYBERPATH_TEST_DB_URL: postgres://cyberpath:cyberpath@localhost:5432/cyberpath_test?sslmode=disable
        # -p 1: internal/db and related packages share/truncate the same
        # live database (see cyberpath's own Makefile test-integration).
        run: go test -race -count=1 -tags=integration -p 1 ./...

  test-securelab:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: securelab
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: securelab_test
          POSTGRES_USER: securelab
          POSTGRES_PASSWORD: securelab
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: securelab/go.sum
      - name: Run tests
        env:
          DATABASE_URL: postgres://securelab:securelab@localhost:5432/securelab_test?sslmode=disable
          SECURELAB_DB_URL: postgres://securelab:securelab@localhost:5432/securelab_test?sslmode=disable
        # -p 1: internal/db truncates shared tables between tests;
        # internal/scenarios reads/writes the same live database, so
        # packages can't run in parallel. tests/integration builds a Docker
        # image that doesn't exist in this repo yet -- excluded, same as
        # ci.yml's test-securelab.
        run: go test -race -count=1 -p 1 ./cmd/... ./internal/... ./tests/scenarios/...

  test-community:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: community
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: community_test
          POSTGRES_USER: community
          POSTGRES_PASSWORD: community
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: community/go.sum
      - name: Run tests
        env:
          COMMUNITY_TEST_DB_URL: postgres://community:community@localhost:5432/community_test?sslmode=disable
        # tests/integration hits a running HTTP server (COMMUNITY_TEST_URL),
        # not just a database -- out of scope here, same exclusion as
        # ci.yml's test-community job.
        run: go test -race -count=1 ./cmd/... ./internal/...

  # ---------------------------------------------------------------------------
  # 2. Docker build + push + sign + SBOM (needs all test jobs)
  # ---------------------------------------------------------------------------
  docker:
    needs:
      - resolve-release-mode
      - test-apiguard
      - test-nis2compass
      - test-citadel
      - test-irflow
      - test-vantage-hash
      - test-sdk
      - test-typescript-sdk
      - test-openscrub
      - test-sinauth
      - test-threatflow
      - test-opencsirt
      - test-cyberpath
      - test-securelab
      - test-community
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      matrix:
        include:
          # apiguard/citadel/irflow build from the repo root: their go.mod
          # `replace` directives point at sdk/go/* submodules outside their
          # own directory, which only resolve if sdk/ is in the build
          # context alongside the platform directory (see each Dockerfile).
          - component: apiguard
            context: .
            dockerfile: apiguard/Dockerfile
          - component: nis2compass
            context: nis2compass
            dockerfile: nis2compass/Dockerfile
          - component: citadel
            context: .
            dockerfile: citadel/Dockerfile
          - component: irflow
            context: .
            dockerfile: irflow/Dockerfile
          # openscrub-api: go.mod's replace directives for sdk/go/citadel
          # and sdk/go/sinauth point outside openscrub/, so it needs the
          # repo root as context, like citadel/apiguard/irflow above (see
          # openscrub/cmd/openscrub/Dockerfile's header comment).
          - component: openscrub-api
            context: .
            dockerfile: openscrub/cmd/openscrub/Dockerfile
          # openscrub-dataplane (Rust/Aya) and openscrub-web (React) are
          # self-contained -- no cross-directory go.mod replace to satisfy.
          - component: openscrub-dataplane
            context: openscrub/rust/dataplane
            dockerfile: openscrub/rust/dataplane/Dockerfile
          - component: openscrub-web
            context: openscrub/web
            dockerfile: openscrub/web/Dockerfile
          # sinauth/go.mod has no replace directives at all -- fully
          # self-contained, unlike citadel/apiguard/irflow/openscrub-api.
          - component: sinauth
            context: sinauth
            dockerfile: sinauth/Dockerfile
          - component: sinauth-web
            context: sinauth/web
            dockerfile: sinauth/web/Dockerfile
          # threatflow/go.mod's replace directive for sdk/go/sinauth points
          # outside threatflow/, exactly like citadel -- needs repo root.
          - component: threatflow
            context: .
            dockerfile: threatflow/Dockerfile
          # opencsirt-api: go.mod replace directives for sdk/go/sinauth and
          # sdk/go/citadel point outside opencsirt/ -- needs repo root.
          - component: opencsirt-api
            context: .
            dockerfile: opencsirt/Dockerfile
          - component: opencsirt-advisory
            context: opencsirt/python
            dockerfile: opencsirt/python/Dockerfile
          - component: opencsirt-web
            context: opencsirt/web
            dockerfile: opencsirt/web/Dockerfile
          # cyberpath: go.mod replace directives for sdk/go/citadel and
          # sdk/go/sinauth point outside cyberpath/ -- needs repo root.
          # cyberpath/web/Dockerfile is deliberately excluded: it exists and
          # is buildable but isn't wired into cyberpath's own
          # docker-compose.yml or Makefile docker-build target yet, so it
          # isn't part of cyberpath's currently-deployed service set.
          - component: cyberpath
            context: .
            dockerfile: cyberpath/Dockerfile
          # securelab: one multi-stage Dockerfile builds two images via
          # different --target stages (see securelab/Makefile and its own
          # docker-compose.yml, both already using --target api / --target
          # web against this same file). go.mod's replace directive for
          # sdk/go/sinauth points outside securelab/ -- needs repo root.
          - component: securelab
            context: .
            dockerfile: securelab/Dockerfile
            target: api
          - component: securelab-web
            context: .
            dockerfile: securelab/Dockerfile
            target: web
          # community/go.mod's replace directive for sdk/go/citadel points
          # outside community/ -- needs repo root.
          - component: community
            context: .
            dockerfile: community/Dockerfile
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version and short SHA
        id: meta
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          if [[ "${GITHUB_REF}" == refs/tags/ecosystem/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/ecosystem/v}"
          else
            # workflow_dispatch (dry-run testing) has no ecosystem/v* tag to
            # derive a version from - GITHUB_REF is just the ref that was
            # dispatched against (e.g. refs/heads/main), and feeding that
            # into an image tag below is invalid (Docker tags can't contain
            # "/"). Use an obviously-synthetic, tag-safe placeholder instead.
            VERSION="0.0.0-dryrun.${SHORT_SHA}"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "short_sha=${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "build_date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          # Only securelab/securelab-web set this (one Dockerfile, two
          # build stages); empty/unset for every other component, which
          # docker/build-push-action treats as "use the final stage" --
          # safe to pass unconditionally.
          target: ${{ matrix.target }}
          # Passed unconditionally to every component. Go-binary
          # Dockerfiles that declare matching ARGs (VERSION/GIT_COMMIT/
          # BUILD_DATE) inject these into their internal/version package
          # via -ldflags -X so a running container's self-reported
          # version actually matches its image tag; components with no
          # such ARG (web/python/rust images) just get an unconsumed
          # build-arg, which BuildKit only warns about, never fails on.
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            GIT_COMMIT=${{ steps.meta.outputs.short_sha }}
            BUILD_DATE=${{ steps.meta.outputs.build_date }}
          push: ${{ needs.resolve-release-mode.outputs.publish == 'true' }}
          tags: |
            ghcr.io/${{ github.repository }}/${{ matrix.component }}:${{ steps.meta.outputs.version }}
            ghcr.io/${{ github.repository }}/${{ matrix.component }}:${{ steps.meta.outputs.short_sha }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,scope=${{ matrix.component }},mode=max

      - name: Install cosign
        if: ${{ needs.resolve-release-mode.outputs.publish == 'true' }}
        uses: sigstore/cosign-installer@v3

      - name: Sign image with cosign (keyless)
        if: ${{ needs.resolve-release-mode.outputs.publish == 'true' }}
        run: |
          cosign sign --yes ghcr.io/${{ github.repository }}/${{ matrix.component }}@${{ steps.build.outputs.digest }}

      # SBOM generation reads the image back from ghcr.io by tag, which only
      # exists there when the build step above actually pushed (publish ==
      # 'true'); the build step never loads the image into the local docker
      # daemon either (no `load: true`), so a dry run has no image anywhere
      # for syft to scan — it previously failed here with "manifest
      # unknown" every dry run, which cascaded via matrix fail-fast into
      # cancelling every other component's build too.
      - name: Install syft
        if: ${{ needs.resolve-release-mode.outputs.publish == 'true' }}
        uses: anchore/sbom-action/download-syft@v0

      - name: Generate SBOM
        if: ${{ needs.resolve-release-mode.outputs.publish == 'true' }}
        run: |
          IMAGE="ghcr.io/${{ github.repository }}/${{ matrix.component }}:${{ steps.meta.outputs.version }}"
          syft "${IMAGE}" -o spdx-json > sbom-${{ matrix.component }}.json

      - name: Attest SBOM to image
        if: ${{ needs.resolve-release-mode.outputs.publish == 'true' }}
        run: |
          cosign attest --yes \
            --predicate sbom-${{ matrix.component }}.json \
            --type spdxjson \
            ghcr.io/${{ github.repository }}/${{ matrix.component }}@${{ steps.build.outputs.digest }}

      - name: Upload SBOM artifact
        if: ${{ needs.resolve-release-mode.outputs.publish == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ matrix.component }}
          path: sbom-${{ matrix.component }}.json

  # ---------------------------------------------------------------------------
  # 3. SDK publish (needs all test jobs)
  # ---------------------------------------------------------------------------
  sdk-publish:
    needs:
      - resolve-release-mode
      - test-apiguard
      - test-nis2compass
      - test-citadel
      - test-irflow
      - test-vantage-hash
      - test-sdk
      - test-typescript-sdk
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4

      # -- Python SDK -> PyPI --
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Build Python SDK
        working-directory: sdk/python
        run: |
          pip install build
          python -m build

      - name: Publish Python SDK to PyPI
        if: ${{ needs.resolve-release-mode.outputs.publish == 'true' }}
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: sdk/python/dist/
          # This job's other publish steps aren't guaranteed to all succeed
          # on the first attempt (see the vantage-hash step below for a
          # concrete case) -- a re-run of this job must not hard-fail just
          # because this step's upload already went through last time.
          skip-existing: true

      - uses: dtolnay/rust-toolchain@stable

      # -- vantage-hash -> crates.io --
      # Must publish before the Rust SDK: sdk/rust/Cargo.toml depends on
      # vantage-hash with a version requirement (crates.io disallows
      # publishing a path-only dependency), so vantage-hash has to exist on
      # crates.io first or the Rust SDK's own publish/dry-run can't resolve
      # it.
      #
      # BUGFIX: this used to mirror the "dry-run ? --dry-run : real" branch
      # below verbatim, which looked symmetric but wasn't safe: a `cargo
      # publish --dry-run` for vantage-hash never actually uploads anything,
      # so on a run where vantage-hash had never been *really* published
      # before, the very next step's `cargo publish --dry-run` for sdk/rust
      # tried to resolve `vantage-hash = "1.0.0"` against the real crates.io
      # registry and failed with "no matching package named `vantage-hash`
      # found" — the dry-run pipeline could never get past its own first
      # real release.
      #
      # Fix: check crates.io directly for this exact version first.
      #   - Already published for real -> nothing to do, dry-run or not;
      #     sdk/rust can resolve it from the registry as-is.
      #   - Not published yet -> publish it for real regardless of the
      #     overall pipeline's dry-run flag. vantage-hash is a stable,
      #     already-versioned leaf dependency with no meaningful "dry run"
      #     state that unblocks anything downstream, and crates.io publishes
      #     are permanent/immutable per-version anyway, so there's nothing
      #     to "undo" later. This is the one deliberate exception to "dry
      #     run never publishes" in this workflow.
      - name: Publish vantage-hash
        working-directory: sdk/vantage-hash
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          VERSION="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')"
          echo "vantage-hash local version: ${VERSION}"

          HTTP_STATUS="$(curl -s -o /dev/null -w '%{http_code}' \
            "https://crates.io/api/v1/crates/vantage-hash/${VERSION}")"

          # The crates.io index-lookup above is a fast pre-check, not an
          # authoritative guarantee -- it can lag shortly after a real
          # publish (observed directly: a real `cargo publish` failed here
          # with "already exists" seconds after this same lookup had
          # returned 200 for a separate, earlier check on the same
          # version). So `cargo publish`'s own "already exists" response is
          # treated as the authoritative success case, not this lookup.
          if [ "${HTTP_STATUS}" = "200" ]; then
            echo "vantage-hash ${VERSION} is already published on crates.io -- skipping (dry-run or real), sdk/rust will resolve it from the registry."
            exit 0
          fi

          if [ "${{ needs.resolve-release-mode.outputs.publish }}" != "true" ]; then
            echo "vantage-hash ${VERSION} is not yet on crates.io. Publishing it for real even though this run is otherwise a dry run -- see comment above this step for why that's safe here."
          fi

          set +e
          PUBLISH_OUTPUT="$(cargo publish 2>&1)"
          PUBLISH_EXIT=$?
          set -e
          echo "${PUBLISH_OUTPUT}"

          if [ ${PUBLISH_EXIT} -ne 0 ]; then
            if echo "${PUBLISH_OUTPUT}" | grep -q "already exists on crates.io index"; then
              echo "vantage-hash ${VERSION} was already published (caught here instead of the index lookup above) -- treating as success."
            else
              exit ${PUBLISH_EXIT}
            fi
          fi

      # -- Rust SDK -> crates.io --
      - name: Publish Rust SDK
        working-directory: sdk/rust
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [ "${{ needs.resolve-release-mode.outputs.publish }}" != "true" ]; then
            cargo publish --dry-run
            exit 0
          fi

          # A later step in this same job (npm/PyPI) can fail after this one
          # already succeeded, forcing a re-run of the whole job -- same
          # retry-safety concern as the vantage-hash step above. Treat
          # cargo publish's own "already exists" response as success.
          set +e
          PUBLISH_OUTPUT="$(cargo publish 2>&1)"
          PUBLISH_EXIT=$?
          set -e
          echo "${PUBLISH_OUTPUT}"

          if [ ${PUBLISH_EXIT} -ne 0 ]; then
            if echo "${PUBLISH_OUTPUT}" | grep -q "already exists on crates.io index"; then
              echo "opensecstack (Rust SDK) was already published -- treating as success."
            else
              exit ${PUBLISH_EXIT}
            fi
          fi

      # -- TypeScript SDK -> npm --
      # Node 22, not 20: npm Trusted Publishing (OIDC, no NPM_TOKEN) needs
      # npm >= 11.5.1, and current npm majors have dropped Node 20 support
      # entirely (npm@latest here failed outright on Node 20 with
      # EBADENGINE, requiring Node ^22.22.2 / ^24.15.0 / >=26). The
      # TypeScript SDK's own test job elsewhere in this workflow still
      # targets Node 20 as its minimum-supported runtime for consumers --
      # this bump is scoped to the publish tooling only, not a change to
      # what the SDK itself supports.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Upgrade npm for Trusted Publishing support
        run: npm install -g npm@latest

      - name: Install TypeScript SDK dependencies
        working-directory: sdk/typescript
        run: npm ci

      - name: Build TypeScript SDK
        working-directory: sdk/typescript
        run: npm run build

      - name: Publish TypeScript SDK to npm
        if: ${{ needs.resolve-release-mode.outputs.publish == 'true' }}
        working-directory: sdk/typescript
        # Trusted Publishing (OIDC) -- see the trusted publisher configured
        # on @opensecstack/sdk's npm settings, pointing at this repo and
        # workflow. No NODE_AUTH_TOKEN: npm mints a short-lived token itself
        # via the id-token: write permission already granted to this job.
        #
        # Same retry-safety concern as the vantage-hash/Rust SDK steps
        # above: a later step failing forces the whole job to retry from
        # the top, so this step's own success must be idempotent too.
        run: |
          set +e
          PUBLISH_OUTPUT="$(npm publish --provenance --access public 2>&1)"
          PUBLISH_EXIT=$?
          set -e
          echo "${PUBLISH_OUTPUT}"

          if [ ${PUBLISH_EXIT} -ne 0 ]; then
            if echo "${PUBLISH_OUTPUT}" | grep -q "cannot publish over the previously published versions"; then
              echo "@opensecstack/sdk was already published -- treating as success."
            else
              exit ${PUBLISH_EXIT}
            fi
          fi

  # ---------------------------------------------------------------------------
  # 4. GitHub Release (needs docker + sdk-publish)
  # ---------------------------------------------------------------------------
  github-release:
    needs:
      - resolve-release-mode
      - docker
      - sdk-publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download SBOM artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: sbom-*
          merge-multiple: true
          path: release-assets/

      - name: Download coverage artifacts
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: "*-coverage"
          merge-multiple: true
          path: release-assets/

      - name: Extract changelog for this version
        id: changelog
        run: |
          if [[ "${GITHUB_REF}" != refs/tags/ecosystem/v* ]]; then
            echo "No ecosystem/v* tag on this run (workflow_dispatch dry run) — nothing to extract." > release-notes.md
            exit 0
          fi
          VERSION="${GITHUB_REF#refs/tags/ecosystem/v}"

          # Real CHANGELOG.md headings are e.g.
          # "## [ecosystem/v1.2.0] - 2026-05-23" or
          # "## [ecosystem/v1.0.0-2026-Q2]" — always "## [ecosystem/v<version>"
          # with no separate "v"/bracket-optional leniency needed.
          awk "/^## \[ecosystem\/v${VERSION//./\\.}\]/{found=1; next} found && /^## \[/{exit} found{print}" \
            CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "No changelog entry found for ecosystem/v${VERSION}." > release-notes.md
            echo "" >> release-notes.md
            echo "See [CHANGELOG.md](CHANGELOG.md) for the full history." >> release-notes.md
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: release-notes.md
          draft: ${{ needs.resolve-release-mode.outputs.publish != 'true' }}
          files: |
            release-assets/**

  # ---------------------------------------------------------------------------
  # 5. Release gate (needs all above)
  # ---------------------------------------------------------------------------
  release-gate:
    needs:
      - resolve-release-mode
      - test-apiguard
      - test-nis2compass
      - test-citadel
      - test-irflow
      - test-vantage-hash
      - test-sdk
      - test-typescript-sdk
      - test-openscrub
      - test-sinauth
      - test-threatflow
      - test-opencsirt
      - test-cyberpath
      - test-securelab
      - test-community
      - docker
      - sdk-publish
      - github-release
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify all jobs succeeded
        run: |
          results="${{ join(needs.*.result, ' ') }}"
          for r in $results; do
            if [[ "$r" == "failure" || "$r" == "cancelled" ]]; then
              echo "::error::Release pipeline failed -- job result: $r"
              exit 1
            fi
          done
          echo "Release pipeline complete"
