name: Publish Go SDK

on:
  push:
    tags:
      - 'sdk/go/v*'
  workflow_dispatch:  # manual test run — see the `tag` job's `if` guard below

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - name: Test
        working-directory: sdk/go
        run: go test -race ./...
      - name: Vet
        working-directory: sdk/go
        run: go vet ./...

  tag:
    needs: test
    # GITHUB_REF is only a tag ref on a real sdk/go/v* tag push — a manual
    # workflow_dispatch run stops after the test job above.
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Create module proxy tag
        run: |
          TAG=${GITHUB_REF#refs/tags/sdk/go/}
          echo "Go module version: $TAG"
          echo "Module is published automatically via GOPROXY when tag is pushed"
          echo "pkg.go.dev will index it within minutes of the tag being visible"
