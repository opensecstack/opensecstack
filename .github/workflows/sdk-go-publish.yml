name: Publish Go SDK

on:
  push:
    tags:
      - 'sdk/go/v*'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - name: Test
        working-directory: sdk/go
        run: go test -race ./...
      - name: Vet
        working-directory: sdk/go
        run: go vet ./...

  tag:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Create module proxy tag
        run: |
          TAG=${GITHUB_REF#refs/tags/sdk/go/}
          echo "Go module version: $TAG"
          echo "Module is published automatically via GOPROXY when tag is pushed"
          echo "pkg.go.dev will index it within minutes of the tag being visible"
