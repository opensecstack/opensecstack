name: Publish Python SDK

on:
  push:
    tags:
      - 'sdk/python/v*'
  workflow_dispatch:  # manual test/build run — see the publish step's `if` guard below

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # for OIDC trusted publishing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build tools
        run: pip install hatch
      - name: Run tests
        working-directory: sdk/python
        run: pip install -e ".[dev]" && pytest tests/
      - name: Build
        working-directory: sdk/python
        run: hatch build
      - name: Publish to PyPI
        # Only a real sdk/python/v* tag push publishes — a manual
        # workflow_dispatch run (used to preview/test this workflow without
        # cutting a release) stops after the build step above.
        if: startsWith(github.ref, 'refs/tags/')
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: sdk/python/dist/
