name: SDK TypeScript Publish

on:
  push:
    tags:
      - 'sdk/typescript/v*'
  workflow_dispatch:  # manual test/build run — see the publish step's `if` guard below

permissions:
  contents: read
  id-token: write  # for npm provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        working-directory: sdk/typescript
        run: npm ci

      - name: Type check
        working-directory: sdk/typescript
        run: npm run typecheck

      - name: Run tests
        working-directory: sdk/typescript
        run: npm test

      - name: Build
        working-directory: sdk/typescript
        run: npm run build

      - name: Publish to npm
        # Only a real sdk/typescript/v* tag push publishes — a manual
        # workflow_dispatch run (used to preview/test this workflow without
        # cutting a release) stops after the build step above.
        if: startsWith(github.ref, 'refs/tags/')
        working-directory: sdk/typescript
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
