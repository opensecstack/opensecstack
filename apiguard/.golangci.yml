version: "2"
run:
  modules-download-mode: readonly
linters:
  enable:
    - bodyclose
    - exhaustive
    - godot
    - gosec
    - misspell
    - noctx
    - rowserrcheck
    - sqlclosecheck
  settings:
    errcheck:
      check-type-assertions: true
      check-blank: true
    godot:
      scope: declarations
    gosec:
      excludes:
        - G104
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
          - errcheck
          - gosec
        path: .*_test\.go
      - linters:
          - exhaustive
        path: cmd/
    paths:
      - third_party$
      - builtin$
      - examples$
      - node_modules
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
formatters:
  enable:
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/opensecstack/opensecstack
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
      - node_modules
