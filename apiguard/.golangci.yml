run:
  timeout: 5m
  modules-download-mode: readonly

linters:
  enable:
    - errcheck
    - gosimple
    - govet
    - ineffassign
    - staticcheck
    - unused
    - gosec
    - goimports
    - misspell
    - exhaustive
    - noctx
    - bodyclose
    - sqlclosecheck
    - rowserrcheck
    - exportloopref
    - godot

linters-settings:
  gosec:
    excludes:
      - G104  # Errors unhandled in defer (handled by errcheck)
  errcheck:
    check-type-assertions: true
    check-blank: true
  goimports:
    local-prefixes: github.com/opensecstack/opensecstack
  godot:
    scope: declarations

issues:
  exclude-rules:
    - path: ".*_test\\.go"
      linters:
        - errcheck
        - gosec
    - path: "cmd/"
      linters:
        - exhaustive
  max-issues-per-linter: 0
  max-same-issues: 0
