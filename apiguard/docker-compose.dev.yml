version: "3.8"

# Development stack with hot reload
# Usage: docker compose -f docker-compose.dev.yml up

services:
  apiguard-api:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "8080:8080"
    environment:
      - APIGUARD_DB_URL=postgres://apiguard:changeme@postgres:5432/apiguard?sslmode=disable
      - APIGUARD_JWT_SECRET=dev-secret-do-not-use-in-production-min32chars
      - APIGUARD_REDIS_URL=redis://redis:6379/0
    volumes:
      - ./cmd:/app/cmd
      - ./internal:/app/internal
      - ./rust:/app/rust
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  apiguard-web:
    build:
      context: ./web
      dockerfile: Dockerfile.dev
    ports:
      - "3000:3000"
    volumes:
      - ./web/src:/app/src
    depends_on:
      - apiguard-api

  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: apiguard
      POSTGRES_PASSWORD: changeme
      POSTGRES_DB: apiguard
    volumes:
      - pgdata-dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U apiguard"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  vampi:
    image: erev0s/vampi:latest
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=development

volumes:
  pgdata-dev:
