version: "3.8"

# Test targets — vulnerable APIs for integration testing
# Usage: docker compose -f docker-compose.test.yml up -d

services:
  vampi:
    image: erev0s/vampi:latest
    ports:
      - "5001:5000"
    environment:
      - FLASK_ENV=development

  crapi:
    image: crapi/crapi:latest
    ports:
      - "8888:8888"

  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: apiguard
      POSTGRES_PASSWORD: changeme
      POSTGRES_DB: apiguard_test
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U apiguard"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
