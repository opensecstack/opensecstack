[package]
name = "analyser"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "L5 Response Analyser for APIGuard"

[[bin]]
name = "apiguard-analyser"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
clap = { version = "4", features = ["derive"] }
