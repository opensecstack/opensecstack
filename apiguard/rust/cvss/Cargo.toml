[package]
name = "cvss"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "L6 CVSS Scorer for APIGuard"

[lib]
name = "cvss"
path = "src/lib.rs"

[[bin]]
name = "apiguard-cvss"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
