[package]
name = "parser"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "L1 OpenAPI Schema Parser for APIGuard"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yml = "0.0.12"
url = "2"
sha2 = "0.11"
thiserror = "2"

[[bin]]
name = "apiguard-parser"
path = "src/main.rs"

[dev-dependencies]
