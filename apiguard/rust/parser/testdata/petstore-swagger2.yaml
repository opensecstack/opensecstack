swagger: "2.0"
info:
  title: Petstore
  version: "1.0.0"
host: petstore.example.com
basePath: /api/v1
schemes:
  - https
paths:
  /pets:
    get:
      tags:
        - pets
      summary: List all pets
      operationId: listPets
      parameters:
        - name: limit
          in: query
          required: false
          type: integer
      security:
        - bearerAuth: []
      produces:
        - application/json
      responses:
        200:
          description: A list of pets
          schema:
            type: array
            items:
              $ref: "#/definitions/Pet"
    post:
      tags:
        - pets
      summary: Create a pet
      operationId: createPet
      security:
        - bearerAuth: []
      consumes:
        - application/json
      parameters:
        - in: body
          name: body
          required: true
          schema:
            $ref: "#/definitions/NewPet"
      responses:
        201:
          description: Pet created
          schema:
            $ref: "#/definitions/Pet"
  /pets/{petId}:
    get:
      tags:
        - pets
      summary: Info for a specific pet
      operationId: showPetById
      parameters:
        - name: petId
          in: path
          required: true
          type: string
      security:
        - bearerAuth: []
      responses:
        200:
          description: Expected response to a valid request
          schema:
            $ref: "#/definitions/Pet"
definitions:
  Pet:
    type: object
    properties:
      id:
        type: integer
      name:
        type: string
      tag:
        type: string
    required:
      - id
      - name
  NewPet:
    type: object
    properties:
      name:
        type: string
      tag:
        type: string
    required:
      - name
securityDefinitions:
  bearerAuth:
    type: basic
