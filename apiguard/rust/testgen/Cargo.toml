[package]
name = "testgen"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "L2 Test Generator for APIGuard — generates OWASP test case specifications from ApiGuardIR"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
parser = { path = "../parser" }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
parser = { path = "../parser" }
