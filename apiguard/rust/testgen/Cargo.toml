[package]
name = "testgen"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "L2 Test Generator for APIGuard — generates OWASP test case specifications from ApiGuardIR"

[lib]
name = "testgen"
path = "src/lib.rs"

[[bin]]
name = "apiguard-testgen"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
parser = { path = "../parser" }
uuid = { version = "1", features = ["v4"] }
clap = { version = "4", features = ["derive"] }

[dev-dependencies]
parser = { path = "../parser" }
