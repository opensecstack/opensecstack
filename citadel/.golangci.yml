version: "2"
run:
  modules-download-mode: readonly
linters:
  enable:
    - bodyclose
    - copyloopvar
    - godot
    - gosec
    - misspell
    - noctx
    - rowserrcheck
    - sqlclosecheck
  settings:
    errcheck:
      check-type-assertions: true
      check-blank: false
    godot:
      scope: declarations
    gosec:
      excludes:
        - G104
        - G404
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
          - errcheck
          - godot
          - gosec
        path: _test\.go$
      - linters:
          - errcheck
          - godot
          - gosec
        path: benches/
      - linters:
          - errcheck
        path: cmd/
    paths:
      - third_party$
      - builtin$
      - examples$
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
formatters:
  enable:
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/opensecstack/citadel
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
