name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  go:
    name: Go build + test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: community
          POSTGRES_PASSWORD: community
          POSTGRES_DB: community
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      meilisearch:
        image: getmeili/meilisearch:v1.10
        env:
          MEILI_MASTER_KEY: ci-meili-key
          MEILI_ENV: development
        ports:
          - 7700:7700
        options: >-
          --health-cmd "wget -qO- http://localhost:7700/health || exit 1"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      COMMUNITY_DB_URL: postgres://community:community@localhost:5432/community?sslmode=disable
      COMMUNITY_JWT_SECRET: ci-secret-32-bytes-padded-for-test
      COMMUNITY_DEV_MODE: "true"
      COMMUNITY_MEILISEARCH_URL: http://localhost:7700
      COMMUNITY_MEILISEARCH_KEY: ci-meili-key
      COMMUNITY_UPLOAD_DIR: /tmp/ci-uploads
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go mod download
      - run: go vet ./...
      - run: go build ./...
      - run: go test ./...

  web:
    name: Frontend typecheck + lint + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build

  docker:
    name: Docker build check
    runs-on: ubuntu-latest
    needs: [go, web]
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/develop'
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build API image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: community-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build Web image
        uses: docker/build-push-action@v5
        with:
          context: web
          file: Dockerfile.web
          push: false
          tags: community-web:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
