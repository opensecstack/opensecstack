name: CyberPath CI

on:
  push:
    branches: [main]
    paths:
      - 'cyberpath/**'
      - '.github/workflows/ci.yml'
  pull_request:
    paths:
      - 'cyberpath/**'

jobs:
  go-test:
    name: Go build + test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cyberpath
    steps:
      - uses: actions/checkout@v4
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache-dependency-path: cyberpath/go.sum
      - name: Download deps
        run: go mod download
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Unit tests
        run: go test -race -count=1 ./...

  go-lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cyberpath
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache-dependency-path: cyberpath/go.sum
      - uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          working-directory: cyberpath
