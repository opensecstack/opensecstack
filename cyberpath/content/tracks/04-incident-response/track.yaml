    quiz: ~
    lab: ~

  - id: ir-lifecycle-and-tools
    order: 2
    title: "The IR Lifecycle and Operational Tools"
    lessons:
      - 02-ir-lifecycle-tools
    quiz: ir-knowledge-check
    lab: ir-triage-lab

certification:
  offered: true
  level: practitioner
  expires_after_months: 24

