[package]
name = "cyberpath-sandbox-host"
version = "1.0.0"
edition = "2021"
description = "Wasm sandbox host for CyberPath lab sessions (v1.0.0 target)"
license = "AGPL-3.0-or-later"

[lib]
name = "cyberpath_sandbox_host"
path = "src/lib.rs"

[[bin]]
name = "cyberpath-sandbox-host"
path = "src/main.rs"

[dependencies]
# Wasm runtime — Bytecode Alliance, WASI Preview 2
wasmtime = { version = "24", features = ["component-model"] }
wasmtime-wasi = "24"

# Async runtime
tokio = { version = "1", features = ["full"] }

# IPC protocol serialisation
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"

# Structured logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Error handling
anyhow = "1"

# UUID generation for session IDs
uuid = { version = "1", features = ["v4"] }

# OCI registry client — pulls the lab.wasm artifact from ghcr.io
# (see .github/workflows/publish-track.yml for the publishing side).
# Same version sigstore 0.14's own `registry`/`cosign` features pull in,
# so the dependency graph resolves to a single copy of oci-client.
oci-client = { version = "0.17", default-features = false, features = ["rustls-tls"] }

# Cosign / Sigstore signature verification for pulled lab images.
# `cosign` brings in the registry (oci-client) + certificate + Rekor
# verification plumbing; `sigstore-trust-root` lets us fetch the public
# Sigstore Fulcio/Rekor trust root over TUF instead of pinning keys by hand,
# matching the keyless OIDC signing publish-track.yml performs with
# `cosign sign --yes` from a GitHub Actions runner.
sigstore = { version = "0.14", default-features = false, features = ["cosign", "sigstore-trust-root", "rustls-tls"] }

# Lab images are minimal `FROM scratch` OCI images whose single layer is a
# (possibly gzip-compressed) tar containing /lab.wasm + /lab.yaml.
tar = "0.4"
flate2 = "1"

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
# wasmtime (already a dependency) natively parses WAT text when its built-in
# `wat` feature is enabled (default). No separate `wat` crate is needed.
