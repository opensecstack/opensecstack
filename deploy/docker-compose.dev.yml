version: "3.8"

# Development stack with hot reload for all platforms
# Usage: docker compose -f deploy/docker-compose.dev.yml up
#   or:  make dev

services:
  # --- APIGuard (dev mode) ---
  apiguard-api:
    build:
      context: ../apiguard
      dockerfile: Dockerfile.dev
    ports:
      - "8080:8080"
    environment:
      - APIGUARD_DB_URL=postgres://apiguard:changeme@postgres:5432/apiguard?sslmode=disable
      - APIGUARD_JWT_SECRET=dev-secret-do-not-use-in-production-min32chars
      - APIGUARD_REDIS_URL=redis://redis:6379/0
      - APIGUARD_CITADEL_URL=http://citadel-api:8099
    volumes:
      - ../apiguard/cmd:/app/cmd
      - ../apiguard/internal:/app/internal
      - ../apiguard/rust:/app/rust
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  apiguard-web:
    build:
      context: ../apiguard/web
      dockerfile: Dockerfile.dev
    ports:
      - "3000:3000"
    volumes:
      - ../apiguard/web/src:/app/src
    depends_on:
      - apiguard-api

  # --- NIS2 Compass (dev mode) ---
  nis2compass-api:
    build:
      context: ../nis2compass
      dockerfile: Dockerfile
    ports:
      - "8090:8090"
    environment:
      - FLASK_ENV=development
      - FLASK_DEBUG=1
      - NIS2_DB_URL=postgresql+psycopg2://nis2compass:changeme@postgres:5432/nis2compass
      - NIS2_REDIS_URL=redis://redis:6379/1
      - NIS2_SECRET_KEY=dev-secret-key-do-not-use-in-production
      - NIS2_JWT_SECRET=dev-jwt-secret-do-not-use-in-production
      - CITADEL_API_URL=http://citadel-api:8099
    volumes:
      - ../nis2compass/app:/app/app
      - ../nis2compass/alembic:/app/alembic
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      nis2-migrate:
        condition: service_completed_successfully

  nis2compass-web:
    build:
      context: ../nis2compass/web
      dockerfile: Dockerfile
    ports:
      - "3001:3000"
    volumes:
      - ../nis2compass/web/src:/app/src
    depends_on:
      - nis2compass-api

  nis2-migrate:
    image: python:3.12-slim
    working_dir: /app
    volumes:
      - ../nis2compass:/app:ro
    command: >
      sh -c "pip install -q alembic psycopg2-binary sqlalchemy &&
             alembic upgrade head"
    environment:
      - NIS2_DB_URL=postgresql+psycopg2://nis2compass:changeme@postgres:5432/nis2compass
    depends_on:
      postgres:
        condition: service_healthy
    restart: on-failure

  # --- Shared Infrastructure ---
  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: apiguard
      POSTGRES_PASSWORD: changeme
      POSTGRES_DB: apiguard
    volumes:
      - pgdata-dev:/var/lib/postgresql/data
      - ./scripts/init-nis2-db.sql:/docker-entrypoint-initdb.d/02-init-nis2.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U apiguard"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata-dev:
