version: "3.8"

# Full opensecstack ecosystem stack
# Usage: docker compose -f deploy/docker-compose.yml up
# Required env vars — copy deploy/.env.example to deploy/.env and fill in values

services:
  # --- APIGuard ---
  apiguard-api:
    image: ghcr.io/opensecstack/apiguard:latest
    build:
      context: ../apiguard
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - APIGUARD_DB_URL=postgres://apiguard:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@postgres:5432/apiguard?sslmode=disable
      - APIGUARD_JWT_SECRET=${APIGUARD_JWT_SECRET:?APIGUARD_JWT_SECRET must be set}
      - APIGUARD_REDIS_URL=redis://:${REDIS_PASSWORD:?REDIS_PASSWORD must be set}@redis:6379/0
    networks:
      - frontend
      - backend
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  apiguard-web:
    image: ghcr.io/opensecstack/apiguard-web:latest
    build:
      context: ../apiguard/web
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    networks:
      - frontend
    depends_on:
      - apiguard-api
    restart: unless-stopped

  # --- NIS2 Compass ---
  nis2compass-api:
    image: ghcr.io/opensecstack/nis2compass:latest
    build:
      context: ../nis2compass
      dockerfile: Dockerfile
    ports:
      - "8090:8090"
    environment:
      - NIS2_DB_URL=postgresql+psycopg2://nis2compass:${NIS2_DB_PASSWORD:?NIS2_DB_PASSWORD must be set}@postgres:5432/nis2compass
      - NIS2_REDIS_URL=redis://:${REDIS_PASSWORD:?REDIS_PASSWORD must be set}@redis:6379/1
      - NIS2_SECRET_KEY=${NIS2_SECRET_KEY:?NIS2_SECRET_KEY must be set}
      - NIS2_JWT_SECRET=${NIS2_JWT_SECRET:?NIS2_JWT_SECRET must be set}
    networks:
      - frontend
      - backend
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      nis2-migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  nis2compass-web:
    image: ghcr.io/opensecstack/nis2compass-web:latest
    build:
      context: ../nis2compass/web
      dockerfile: Dockerfile
    ports:
      - "3001:3000"
    networks:
      - frontend
    depends_on:
      - nis2compass-api
    restart: unless-stopped

  nis2-migrate:
    image: python:3.12-slim
    working_dir: /app
    volumes:
      - ../nis2compass:/app:ro
    command: >
      sh -c "pip install -q alembic psycopg2-binary sqlalchemy &&
             alembic upgrade head"
    environment:
      - NIS2_DB_URL=postgresql+psycopg2://nis2compass:${NIS2_DB_PASSWORD:?NIS2_DB_PASSWORD must be set}@postgres:5432/nis2compass
    networks:
      - backend
    depends_on:
      postgres:
        condition: service_healthy
    restart: on-failure

  # --- Shared Infrastructure ---
  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: apiguard
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_DB: apiguard
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/init-nis2-db.sql:/docker-entrypoint-initdb.d/02-init-nis2.sql:ro
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U apiguard"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: redis-server --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
    ports:
      - "6379:6379"
    networks:
      - backend
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  pgdata:

networks:
  frontend:
  backend:
