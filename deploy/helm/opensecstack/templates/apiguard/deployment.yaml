apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "opensecstack.fullname" . }}-apiguard
  namespace: {{ .Release.Namespace }}
  labels:
    app: apiguard
    {{- include "opensecstack.labels" . | nindent 4 }}
spec:
  {{- if not .Values.hpa.enabled }}
  replicas: {{ .Values.apiguard.replicas }}
  {{- end }}
  selector:
    matchLabels:
      app: apiguard
  template:
    metadata:
      labels:
        app: apiguard
    spec:
      containers:
        - name: apiguard
          image: {{ include "opensecstack.image" (dict "repository" .Values.apiguard.image.repository "tag" .Values.apiguard.image.tag "global" .Values.global) }}
          imagePullPolicy: {{ include "opensecstack.pullPolicy" (dict "global" .Values.global "pullPolicy" "") }}
          ports:
            - containerPort: {{ .Values.apiguard.service.port }}
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: opensecstack-db-secrets
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_HOST
              valueFrom:
                configMapKeyRef:
                  name: opensecstack-config
                  key: POSTGRES_HOST
            - name: POSTGRES_PORT
              valueFrom:
                configMapKeyRef:
                  name: opensecstack-config
                  key: POSTGRES_PORT
            - name: APIGUARD_DB_NAME
              valueFrom:
                configMapKeyRef:
                  name: opensecstack-config
                  key: APIGUARD_DB_NAME
            - name: APIGUARD_DB_URL
              value: "postgres://apiguard:$(POSTGRES_PASSWORD)@$(POSTGRES_HOST):$(POSTGRES_PORT)/$(APIGUARD_DB_NAME)?sslmode=disable"
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: opensecstack-app-secrets
                  key: REDIS_PASSWORD
            - name: REDIS_HOST
              valueFrom:
                configMapKeyRef:
                  name: opensecstack-config
                  key: REDIS_HOST
            - name: REDIS_PORT
              valueFrom:
                configMapKeyRef:
                  name: opensecstack-config
                  key: REDIS_PORT
            - name: APIGUARD_REDIS_URL
              value: "redis://:$(REDIS_PASSWORD)@$(REDIS_HOST):$(REDIS_PORT)/0"
            - name: APIGUARD_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: opensecstack-app-secrets
                  key: APIGUARD_JWT_SECRET
            - name: LOG_LEVEL
              valueFrom:
                configMapKeyRef:
                  name: opensecstack-config
                  key: LOG_LEVEL
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: {{ .Values.apiguard.service.port }}
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: {{ .Values.apiguard.service.port }}
            initialDelaySeconds: 30
            periodSeconds: 15
            failureThreshold: 3
          resources:
            {{- toYaml .Values.apiguard.resources | nindent 12 }}
