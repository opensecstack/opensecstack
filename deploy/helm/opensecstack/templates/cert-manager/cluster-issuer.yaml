{{- if .Values.certManager.enabled }}
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: {{ .Values.certManager.issuerType }}
  labels:
    {{- include "opensecstack.labels" . | nindent 4 }}
spec:
  acme:
    {{- if eq .Values.certManager.issuerType "letsencrypt-staging" }}
    server: https://acme-staging-v02.api.letsencrypt.org/directory
    {{- else }}
    server: https://acme-v02.api.letsencrypt.org/directory
    {{- end }}
    email: {{ .Values.certManager.email | quote }}
    privateKeySecretRef:
      name: {{ .Values.certManager.issuerType }}
    solvers:
      - http01:
          ingress:
            class: nginx
{{- end }}
