apiVersion: v1
kind: Service
metadata:
  name: {{ include "opensecstack.fullname" . }}-citadel
  namespace: {{ .Release.Namespace }}
  labels:
    app: citadel
    {{- include "opensecstack.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app: citadel
  ports:
    - name: http
      port: {{ .Values.citadel.service.port }}
      targetPort: {{ .Values.citadel.service.port }}
      protocol: TCP
