apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "opensecstack.fullname" . }}-nis2compass
  namespace: {{ .Release.Namespace }}
  labels:
    app: nis2compass
    {{- include "opensecstack.labels" . | nindent 4 }}
spec:
  {{- if not .Values.hpa.enabled }}
  replicas: {{ .Values.nis2compass.replicas }}
  {{- end }}
  selector:
    matchLabels:
      app: nis2compass
  template:
    metadata:
      labels:
        app: nis2compass
    spec:
      initContainers:
        - name: nis2-migrate
          image: {{ include "opensecstack.image" (dict "repository" .Values.nis2compass.image.repository "tag" .Values.nis2compass.image.tag "global" .Values.global) }}
          command:
            - python
            - -m
            - alembic
            - upgrade
            - head
          env:
            - name: NIS2_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: opensecstack-db-secrets
                  key: NIS2_DB_PASSWORD
            - name: POSTGRES_HOST
              valueFrom:
                configMapKeyRef:
                  name: opensecstack-config
                  key: POSTGRES_HOST
            - name: POSTGRES_PORT
              valueFrom:
                configMapKeyRef:
                  name: opensecstack-config
                  key: POSTGRES_PORT
            - name: NIS2_DB_NAME
              valueFrom:
                configMapKeyRef:
                  name: opensecstack-config
                  key: NIS2_DB_NAME
            - name: NIS2_DB_URL
              value: "postgresql+psycopg2://nis2compass:$(NIS2_DB_PASSWORD)@$(POSTGRES_HOST):$(POSTGRES_PORT)/$(NIS2_DB_NAME)"
      containers:
        - name: nis2compass
          image: {{ include "opensecstack.image" (dict "repository" .Values.nis2compass.image.repository "tag" .Values.nis2compass.image.tag "global" .Values.global) }}
          imagePullPolicy: {{ include "opensecstack.pullPolicy" (dict "global" .Values.global "pullPolicy" "") }}
          ports:
            - containerPort: {{ .Values.nis2compass.service.port }}
          env:
            - name: NIS2_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: opensecstack-db-secrets
                  key: NIS2_DB_PASSWORD
            - name: POSTGRES_HOST
              valueFrom:
                configMapKeyRef:
                  name: opensecstack-config
                  key: POSTGRES_HOST
            - name: POSTGRES_PORT
              valueFrom:
                configMapKeyRef:
                  name: opensecstack-config
                  key: POSTGRES_PORT
            - name: NIS2_DB_NAME
              valueFrom:
                configMapKeyRef:
                  name: opensecstack-config
                  key: NIS2_DB_NAME
            - name: NIS2_DB_URL
              value: "postgresql+psycopg2://nis2compass:$(NIS2_DB_PASSWORD)@$(POSTGRES_HOST):$(POSTGRES_PORT)/$(NIS2_DB_NAME)"
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: opensecstack-app-secrets
                  key: REDIS_PASSWORD
            - name: REDIS_HOST
              valueFrom:
                configMapKeyRef:
                  name: opensecstack-config
                  key: REDIS_HOST
            - name: REDIS_PORT
              valueFrom:
                configMapKeyRef:
                  name: opensecstack-config
                  key: REDIS_PORT
            - name: NIS2_REDIS_URL
              value: "redis://:$(REDIS_PASSWORD)@$(REDIS_HOST):$(REDIS_PORT)/1"
            - name: NIS2_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: opensecstack-app-secrets
                  key: NIS2_SECRET_KEY
            - name: NIS2_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: opensecstack-app-secrets
                  key: NIS2_JWT_SECRET
            - name: LOG_LEVEL
              valueFrom:
                configMapKeyRef:
                  name: opensecstack-config
                  key: LOG_LEVEL
          readinessProbe:
            httpGet:
              path: /health
              port: {{ .Values.nis2compass.service.port }}
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: {{ .Values.nis2compass.service.port }}
            initialDelaySeconds: 30
            periodSeconds: 15
            failureThreshold: 3
          resources:
            {{- toYaml .Values.nis2compass.resources | nindent 12 }}
