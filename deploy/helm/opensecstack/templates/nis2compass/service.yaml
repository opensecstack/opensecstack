apiVersion: v1
kind: Service
metadata:
  name: {{ include "opensecstack.fullname" . }}-nis2compass
  namespace: {{ .Release.Namespace }}
  labels:
    app: nis2compass
    {{- include "opensecstack.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app: nis2compass
  ports:
    - name: http
      port: {{ .Values.nis2compass.service.port }}
      targetPort: {{ .Values.nis2compass.service.port }}
      protocol: TCP
