apiVersion: apps/v1
kind: Deployment
metadata:
  name: apiguard
  namespace: opensecstack
  labels:
    app: apiguard
    app.kubernetes.io/part-of: opensecstack
spec:
  replicas: 2
  selector:
    matchLabels:
      app: apiguard
  template:
    metadata:
      labels:
        app: apiguard
    spec:
      containers:
        - name: apiguard
          image: ghcr.io/opensecstack/apiguard:latest
          ports:
            - containerPort: 8080
          env:
            # --- DB connection ---
            # Intermediate variables are resolved first; APIGUARD_DB_URL then
            # references them using Kubernetes $(VAR_NAME) substitution.
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: opensecstack-db-secrets
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_HOST
              valueFrom:
                configMapKeyRef:
                  name: opensecstack-config
                  key: POSTGRES_HOST
            - name: POSTGRES_PORT
              valueFrom:
                configMapKeyRef:
                  name: opensecstack-config
                  key: POSTGRES_PORT
            - name: APIGUARD_DB_NAME
              valueFrom:
                configMapKeyRef:
                  name: opensecstack-config
                  key: APIGUARD_DB_NAME
            - name: APIGUARD_DB_URL
              value: "postgres://apiguard:$(POSTGRES_PASSWORD)@$(POSTGRES_HOST):$(POSTGRES_PORT)/$(APIGUARD_DB_NAME)?sslmode=disable"

            # --- Redis connection ---
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: opensecstack-app-secrets
                  key: REDIS_PASSWORD
            - name: REDIS_HOST
              valueFrom:
                configMapKeyRef:
                  name: opensecstack-config
                  key: REDIS_HOST
            - name: REDIS_PORT
              valueFrom:
                configMapKeyRef:
                  name: opensecstack-config
                  key: REDIS_PORT
            - name: APIGUARD_REDIS_URL
              value: "redis://:$(REDIS_PASSWORD)@$(REDIS_HOST):$(REDIS_PORT)/0"

            # --- Secrets ---
            - name: APIGUARD_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: opensecstack-app-secrets
                  key: APIGUARD_JWT_SECRET

            # --- Non-secret config ---
            - name: LOG_LEVEL
              valueFrom:
                configMapKeyRef:
                  name: opensecstack-config
                  key: LOG_LEVEL

          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 15
            failureThreshold: 3

          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
