apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: apiguard-ingress
  namespace: opensecstack
  labels:
    app: apiguard
    app.kubernetes.io/part-of: opensecstack
  annotations:
    # Allow larger request bodies for OpenAPI spec file uploads
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    # Uncomment below to enable HTTPS redirect once TLS is configured
    # nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: nginx
  rules:
    - host: apiguard.opensecstack.local   # Replace with your actual hostname
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: apiguard-service
                port:
                  number: 8080

  # TLS — uncomment and populate once a certificate is available.
  # Create the TLS secret first:
  #   kubectl create secret tls apiguard-tls \
  #     --cert=path/to/tls.crt \
  #     --key=path/to/tls.key \
  #     -n opensecstack
  #
  # tls:
  #   - hosts:
  #       - apiguard.opensecstack.local
  #     secretName: apiguard-tls
