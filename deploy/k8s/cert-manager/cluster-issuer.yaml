# ClusterIssuer for Let's Encrypt via cert-manager.
#
# Prerequisites:
#   kubectl apply -f https://github.com/cert-manager/cert-manager/releases/latest/download/cert-manager.yaml
#
# Two issuers are provided:
#   - letsencrypt-staging  : use first to verify the setup (no rate limits)
#   - letsencrypt-prod     : switch once staging succeeds

---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-staging
  labels:
    app.kubernetes.io/part-of: opensecstack
spec:
  acme:
    server: https://acme-staging-v02.api.letsencrypt.org/directory
    email: admin@opensecstack.local   # Replace with a real address
    privateKeySecretRef:
      name: letsencrypt-staging-key
    solvers:
      - http01:
          ingress:
            ingressClassName: nginx

---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
  labels:
    app.kubernetes.io/part-of: opensecstack
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: admin@opensecstack.local   # Replace with a real address
    privateKeySecretRef:
      name: letsencrypt-prod-key
    solvers:
      - http01:
          ingress:
            ingressClassName: nginx
