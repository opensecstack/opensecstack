apiVersion: apps/v1
kind: Deployment
metadata:
  name: nis2compass
  namespace: opensecstack
  labels:
    app: nis2compass
    app.kubernetes.io/part-of: opensecstack
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nis2compass
  template:
    metadata:
      labels:
        app: nis2compass
    spec:
      # Run database migrations before any application replica starts.
      # The initContainer exits 0 on success; Kubernetes will restart it on
      # failure (and keep the main container from starting) until it succeeds.
      initContainers:
        - name: nis2-migrate
          image: ghcr.io/opensecstack/nis2compass:latest
          command:
            - python
            - -m
            - alembic
            - upgrade
            - head
          env:
            - name: NIS2_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: opensecstack-db-secrets
                  key: NIS2_DB_PASSWORD
            - name: POSTGRES_HOST
              valueFrom:
                configMapKeyRef:
                  name: opensecstack-config
                  key: POSTGRES_HOST
            - name: POSTGRES_PORT
              valueFrom:
                configMapKeyRef:
                  name: opensecstack-config
                  key: POSTGRES_PORT
            - name: NIS2_DB_NAME
              valueFrom:
                configMapKeyRef:
                  name: opensecstack-config
                  key: NIS2_DB_NAME
            - name: NIS2_DB_URL
              value: "postgresql+psycopg2://nis2compass:$(NIS2_DB_PASSWORD)@$(POSTGRES_HOST):$(POSTGRES_PORT)/$(NIS2_DB_NAME)"

      containers:
        - name: nis2compass
          image: ghcr.io/opensecstack/nis2compass:latest
          ports:
            - containerPort: 8090
          env:
            # --- DB connection ---
            - name: NIS2_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: opensecstack-db-secrets
                  key: NIS2_DB_PASSWORD
            - name: POSTGRES_HOST
              valueFrom:
                configMapKeyRef:
                  name: opensecstack-config
                  key: POSTGRES_HOST
            - name: POSTGRES_PORT
              valueFrom:
                configMapKeyRef:
                  name: opensecstack-config
                  key: POSTGRES_PORT
            - name: NIS2_DB_NAME
              valueFrom:
                configMapKeyRef:
                  name: opensecstack-config
                  key: NIS2_DB_NAME
            - name: NIS2_DB_URL
              value: "postgresql+psycopg2://nis2compass:$(NIS2_DB_PASSWORD)@$(POSTGRES_HOST):$(POSTGRES_PORT)/$(NIS2_DB_NAME)"

            # --- Redis connection ---
            # Database index 1 matches the deploy/docker-compose.yml redis URL for NIS2.
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: opensecstack-app-secrets
                  key: REDIS_PASSWORD
            - name: REDIS_HOST
              valueFrom:
                configMapKeyRef:
                  name: opensecstack-config
                  key: REDIS_HOST
            - name: REDIS_PORT
              valueFrom:
                configMapKeyRef:
                  name: opensecstack-config
                  key: REDIS_PORT
            - name: NIS2_REDIS_URL
              value: "redis://:$(REDIS_PASSWORD)@$(REDIS_HOST):$(REDIS_PORT)/1"

            # --- Secrets ---
            - name: NIS2_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: opensecstack-app-secrets
                  key: NIS2_SECRET_KEY
            - name: NIS2_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: opensecstack-app-secrets
                  key: NIS2_JWT_SECRET

            # --- Non-secret config ---
            - name: LOG_LEVEL
              valueFrom:
                configMapKeyRef:
                  name: opensecstack-config
                  key: LOG_LEVEL

          readinessProbe:
            httpGet:
              path: /health
              port: 8090
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /health
              port: 8090
            initialDelaySeconds: 30
            periodSeconds: 15
            failureThreshold: 3

          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
