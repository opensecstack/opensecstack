apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nis2compass-ingress
  namespace: opensecstack
  labels:
    app: nis2compass
    app.kubernetes.io/part-of: opensecstack
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    # cert-manager will provision and renew the TLS certificate automatically.
    # Switch to letsencrypt-staging first to validate, then change to letsencrypt-prod.
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: nginx
  rules:
    - host: nis2compass.opensecstack.local   # Replace with your actual hostname
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: nis2compass-service
                port:
                  number: 8090
  tls:
    - hosts:
        - nis2compass.opensecstack.local     # Must match the host above
      secretName: nis2compass-tls            # cert-manager will create this secret
