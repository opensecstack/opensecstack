apiVersion: v1
kind: Service
metadata:
  name: postgres-service
  namespace: opensecstack
  labels:
    app: postgres
    app.kubernetes.io/part-of: opensecstack
spec:
  type: ClusterIP
  selector:
    app: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
      protocol: TCP
