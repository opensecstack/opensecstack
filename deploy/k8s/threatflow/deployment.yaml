apiVersion: apps/v1
kind: Deployment
metadata:
  name: threatflow
  namespace: opensecstack
  labels:
    app: threatflow
    app.kubernetes.io/part-of: opensecstack
spec:
  replicas: 2
  selector:
    matchLabels:
      app: threatflow
  template:
    metadata:
      labels:
        app: threatflow
        app.kubernetes.io/part-of: opensecstack
    spec:
      containers:
        - name: threatflow
          image: ghcr.io/opensecstack/threatflow:latest
          ports:
            - name: http
              containerPort: 8091
              protocol: TCP
          env:
            - name: THREATFLOW_DB_URL
              valueFrom:
                secretKeyRef:
                  name: threatflow-secrets
                  key: database-url
            - name: THREATFLOW_CITADEL_API_URL
              valueFrom:
                configMapKeyRef:
                  name: opensecstack-config
                  key: citadel-api-url
            - name: THREATFLOW_CITADEL_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: threatflow-secrets
                  key: citadel-key-id
            - name: THREATFLOW_CITADEL_KEY_SECRET
              valueFrom:
                secretKeyRef:
                  name: threatflow-secrets
                  key: citadel-key-secret
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
