apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: threatflow
  namespace: opensecstack
  labels:
    app: threatflow
    app.kubernetes.io/part-of: opensecstack
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: threatflow
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
