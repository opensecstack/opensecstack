services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${IRFLOW_DB_USER:-irflow}
      POSTGRES_PASSWORD: ${IRFLOW_DB_PASSWORD:-irflow}
      POSTGRES_DB: ${IRFLOW_DB_NAME:-irflow}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${IRFLOW_DB_USER:-irflow}", "-d", "${IRFLOW_DB_NAME:-irflow}"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    image: ghcr.io/opensecstack/opensecstack/irflow:latest
    build:
      context: .
    ports:
      - "${IRFLOW_SERVER_PORT:-8083}:8083"
    environment:
      IRFLOW_DB_HOST: postgres
      IRFLOW_DB_PORT: ${IRFLOW_DB_PORT:-5432}
      IRFLOW_DB_NAME: ${IRFLOW_DB_NAME:-irflow}
      IRFLOW_DB_USER: ${IRFLOW_DB_USER:-irflow}
      IRFLOW_DB_PASSWORD: ${IRFLOW_DB_PASSWORD:-irflow}
      IRFLOW_DB_SSL_MODE: ${IRFLOW_DB_SSL_MODE:-disable}
      IRFLOW_AUTH_SECRET: ${IRFLOW_AUTH_SECRET:-}
      IRFLOW_AUTH_PEPPER: ${IRFLOW_AUTH_PEPPER:-}
      IRFLOW_AUTH_TOKEN_TTL: ${IRFLOW_AUTH_TOKEN_TTL:-8h}
      IRFLOW_AUTH_ISSUER: ${IRFLOW_AUTH_ISSUER:-irflow}
      IRFLOW_WEBHOOK_SECRET: ${IRFLOW_WEBHOOK_SECRET:-}
      IRFLOW_WEBHOOK_APIGUARD_SECRET: ${IRFLOW_WEBHOOK_APIGUARD_SECRET:-}
      IRFLOW_WEBHOOK_CITADEL_SECRET: ${IRFLOW_WEBHOOK_CITADEL_SECRET:-}
      IRFLOW_WEBHOOK_THREATFLOW_SECRET: ${IRFLOW_WEBHOOK_THREATFLOW_SECRET:-}
      IRFLOW_WEBHOOK_CALLBACK_URL: ${IRFLOW_WEBHOOK_CALLBACK_URL:-}
      IRFLOW_CITADEL_API_URL: ${IRFLOW_CITADEL_API_URL:-}
      IRFLOW_CITADEL_KEY_ID: ${IRFLOW_CITADEL_KEY_ID:-}
      IRFLOW_CITADEL_KEY_SECRET: ${IRFLOW_CITADEL_KEY_SECRET:-}
      IRFLOW_CITADEL_PROJECT_ID: ${IRFLOW_CITADEL_PROJECT_ID:-}
      IRFLOW_CITADEL_DRY_RUN: ${IRFLOW_CITADEL_DRY_RUN:-true}
      IRFLOW_NIS2_API_URL: ${IRFLOW_NIS2_API_URL:-}
      IRFLOW_NIS2_API_KEY: ${IRFLOW_NIS2_API_KEY:-}
      IRFLOW_NIS2_ASSESSMENT_ID: ${IRFLOW_NIS2_ASSESSMENT_ID:-}
      IRFLOW_NIS2_MEASURE_REF: ${IRFLOW_NIS2_MEASURE_REF:-b}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
