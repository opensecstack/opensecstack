# secret.yaml — DO NOT commit real values.
# Copy this file, fill in base64-encoded values, then apply with:
#   kubectl apply -f secret.yaml -n nis2compass
#
# To base64-encode a value (no trailing newline):
#   echo -n 'your-secret-value' | base64
#
# Recommended: generate strong secrets with:
#   openssl rand -hex 32 | base64   (for SECRET_KEY, JWT_SECRET, WEBHOOK_SECRET)
#   openssl rand -base64 24         (for passwords)
#
# Alternatively, use kubectl imperatively (avoids storing secrets on disk):
#   kubectl create secret generic nis2compass-secrets \
#     --from-literal=NIS2_SECRET_KEY='<value>' \
#     --from-literal=NIS2_JWT_SECRET='<value>' \
#     --from-literal=NIS2_DB_PASSWORD='<value>' \
#     --from-literal=POSTGRES_PASSWORD='<value>' \
#     --from-literal=REDIS_PASSWORD='<value>' \
#     --from-literal=NIS2_WEBHOOK_SECRET='<value>' \
#     --from-literal=CITADEL_API_KEY='<value>' \
#     --from-literal=NIS2_API_KEYS='<value>' \
#     --from-literal=NIS2_SMTP_PASSWORD='<value>' \
#     -n nis2compass

---
apiVersion: v1
kind: Secret
metadata:
  name: nis2compass-secrets
  namespace: nis2compass
  labels:
    app.kubernetes.io/part-of: nis2compass
type: Opaque
data:
  # Flask/app secret key (min 32 chars)
  NIS2_SECRET_KEY: REPLACE_WITH_BASE64_ENCODED_SECRET_KEY

  # JWT signing secret (min 32 chars)
  NIS2_JWT_SECRET: REPLACE_WITH_BASE64_ENCODED_JWT_SECRET

  # Application database user password (for the nis2compass DB user)
  NIS2_DB_PASSWORD: REPLACE_WITH_BASE64_ENCODED_DB_PASSWORD

  # PostgreSQL superuser password (used by the postgres StatefulSet itself)
  POSTGRES_PASSWORD: REPLACE_WITH_BASE64_ENCODED_POSTGRES_PASSWORD

  # Redis password
  REDIS_PASSWORD: REPLACE_WITH_BASE64_ENCODED_REDIS_PASSWORD

  # HMAC-SHA256 signing secret for outbound webhooks.
  # Required when NIS2_WEBHOOK_URL is set; leave as empty string otherwise:
  #   echo -n '' | base64  →  (empty string)
  NIS2_WEBHOOK_SECRET: REPLACE_WITH_BASE64_ENCODED_WEBHOOK_SECRET

  # CITADEL API key for audit forwarding (leave as '' if not used)
  CITADEL_API_KEY: REPLACE_WITH_BASE64_ENCODED_CITADEL_API_KEY

  # Comma-separated plaintext API keys (leave as '' if not used)
  NIS2_API_KEYS: REPLACE_WITH_BASE64_ENCODED_API_KEYS

  # SMTP password for email notifications (leave as '' if not used)
  NIS2_SMTP_PASSWORD: REPLACE_WITH_BASE64_ENCODED_SMTP_PASSWORD
