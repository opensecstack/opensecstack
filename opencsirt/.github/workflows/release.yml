name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write
  packages: write

jobs:
  release-images:
    name: Build and push container images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata (API)
        id: meta-api
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}-api
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest

      - name: Extract Docker metadata (Advisory)
        id: meta-advisory
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}-advisory
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest

      - name: Extract Docker metadata (Web)
        id: meta-web
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}-web
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest

      - name: Build and push API image
        uses: docker/build-push-action@v5
        with:
          context: .
          dockerfile: Dockerfile
          push: true
          tags: ${{ steps.meta-api.outputs.tags }}
          labels: ${{ steps.meta-api.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Advisory image
        uses: docker/build-push-action@v5
        with:
          context: python
          dockerfile: python/Dockerfile
          push: true
          tags: ${{ steps.meta-advisory.outputs.tags }}
          labels: ${{ steps.meta-advisory.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Web image
        uses: docker/build-push-action@v5
        with:
          context: web
          dockerfile: web/Dockerfile
          push: true
          tags: ${{ steps.meta-web.outputs.tags }}
          labels: ${{ steps.meta-web.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release-binary:
    name: Build and upload Go binary
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          VERSION="${GITHUB_REF_NAME}"
          OUTPUT="opencsirt-${VERSION}-${{ matrix.goos }}-${{ matrix.goarch }}"
          go build -ldflags "-s -w -X main.version=${VERSION}" \
            -o "${OUTPUT}" ./cmd/opencsirt
          tar czf "${OUTPUT}.tar.gz" "${OUTPUT}"

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: opencsirt-${{ matrix.goos }}-${{ matrix.goarch }}
          path: "*.tar.gz"
          retention-days: 1

  github-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [release-images, release-binary]
    steps:
      - uses: actions/checkout@v4

      - name: Download all binary artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.tar.gz
          generate_release_notes: true
          body: |
            ## Docker images

            Pull the images for this release:

            ```bash
            # API
            docker pull ghcr.io/${{ github.repository }}-api:${{ github.ref_name }}

            # Advisory (Python subsystem)
            docker pull ghcr.io/${{ github.repository }}-advisory:${{ github.ref_name }}

            # Web (nginx dashboard)
            docker pull ghcr.io/${{ github.repository }}-web:${{ github.ref_name }}
            ```

            ## Quick start with Docker Compose

            ```bash
            # Set required secrets
            cat > .env <<'EOF'
            OPENCSIRT_DB_PASSWORD=change-me
            OPENCSIRT_JWT_SECRET=change-me-32-bytes-padded-for-prod
            OPENCSIRT_PASSWORD_PEPPER=change-me-32-bytes-padded-for-prod
            EOF

            # Run the stack (images pulled from GHCR, no build needed)
            docker compose up -d
            ```

            > **Note:** Set `OPENCSIRT_CITADEL_DRY_RUN=false` only after verifying CITADEL connectivity.
