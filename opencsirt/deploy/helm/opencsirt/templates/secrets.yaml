{{- if not .Values.secrets.existingSecret }}
{{- if not .Values.secrets.generateOnInstall }}
{{- fail "secrets.existingSecret is empty and secrets.generateOnInstall is false — refusing to install without a Secret." }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "opencsirt.fullname" . }}-secrets
  labels:
    {{- include "opencsirt.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  jwtSecret: {{ randAlphaNum 48 | quote }}
  postgresPassword: {{ randAlphaNum 32 | quote }}
  passwordPepper: {{ randAlphaNum 48 | quote }}
  users: ""
  citadelHmacSecret: {{ randAlphaNum 48 | quote }}
  # Auto-generated: shared secret the Go API uses to verify IRFlow webhook
  # signatures. Must match the webhook secret configured in IRFlow.
  irflowWebhookSecret: {{ randAlphaNum 48 | quote }}
  # Auto-generated: HS256 signing key for advisory-service JWTs issued by
  # the Go API and validated by the Python advisory bridge.
  advisoryServiceJwt: {{ randAlphaNum 48 | quote }}
  # Operator-supplied: set via --set secrets.threatflowApiKey=<value> or a
  # pre-existing Secret. Leave empty to disable ThreatFlow polling.
  threatflowApiKey: {{ .Values.secrets.threatflowApiKey | default "" | quote }}
  # Operator-supplied: set via --set secrets.vertguardApiKey=<value> or a
  # pre-existing Secret. Leave empty to disable VertGuard enrichment.
  vertguardApiKey: {{ .Values.secrets.vertguardApiKey | default "" | quote }}
{{- end }}
