global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: opencsirt-api
    metrics_path: /api/v1/metrics
    # Scraper must present a JWT — the metrics endpoint is auth-gated
    # because counters reveal incident counts and advisory cadence.
    # Provision a long-lived "readonly" JWT and load it from a file.
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/opencsirt_token
    static_configs:
      - targets: ["opencsirt-api:8088"]
