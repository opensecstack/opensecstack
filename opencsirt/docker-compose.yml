version: "3.9"

# OpenCSIRT production compose — builds all images from source.
# Copy .env.example to .env and fill in secrets before running.
#
# Usage:
#   docker compose up -d --build

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: opencsirt
      POSTGRES_PASSWORD: ${OPENCSIRT_DB_PASSWORD:?set OPENCSIRT_DB_PASSWORD in .env}
      POSTGRES_DB: opencsirt
    volumes:
      - opencsirt-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opencsirt"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - internal

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 2s
      retries: 5
    networks:
      - internal

  advisory:
    build:
      context: python
      dockerfile: Dockerfile
    restart: unless-stopped
    expose:
      - "8089"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    environment:
      OPENCSIRT_PY_HOST: "0.0.0.0"
      OPENCSIRT_PY_PORT: "8089"
      OPENCSIRT_PY_LOG_LEVEL: ${OPENCSIRT_LOG_LEVEL:-INFO}
      OPENCSIRT_PY_REDIS_URL: redis://redis:6379/0
      OPENCSIRT_PY_JWT_SECRET: ${OPENCSIRT_JWT_SECRET:?set OPENCSIRT_JWT_SECRET in .env}
      OPENCSIRT_PY_JWT_ISSUER: opencsirt
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - internal

  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      advisory:
        condition: service_started
    ports:
      - "${OPENCSIRT_HTTP_PORT:-8088}:8088"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      OPENCSIRT_HTTP_ADDR: ":8088"
      OPENCSIRT_DB_URL: "postgres://opencsirt:${OPENCSIRT_DB_PASSWORD:?set OPENCSIRT_DB_PASSWORD in .env}@postgres:5432/opencsirt?sslmode=disable"
      OPENCSIRT_JWT_SECRET: ${OPENCSIRT_JWT_SECRET:?set OPENCSIRT_JWT_SECRET in .env}
      OPENCSIRT_PASSWORD_PEPPER: ${OPENCSIRT_PASSWORD_PEPPER:?set OPENCSIRT_PASSWORD_PEPPER in .env}
      OPENCSIRT_USERS: ${OPENCSIRT_USERS:-}
      OPENCSIRT_TOKEN_TTL: ${OPENCSIRT_TOKEN_TTL:-12h}
      OPENCSIRT_ADVISORY_SERVICE_URL: http://advisory:8089
      OPENCSIRT_ADVISORY_SERVICE_JWT: ${OPENCSIRT_ADVISORY_SERVICE_JWT:-}
      OPENCSIRT_IRFLOW_WEBHOOK_SECRET: ${OPENCSIRT_IRFLOW_WEBHOOK_SECRET:-}
      OPENCSIRT_IRFLOW_STRICT_SEVERITY: ${OPENCSIRT_IRFLOW_STRICT_SEVERITY:-false}
      OPENCSIRT_THREATFLOW_API_URL: ${OPENCSIRT_THREATFLOW_API_URL:-}
      OPENCSIRT_THREATFLOW_API_KEY: ${OPENCSIRT_THREATFLOW_API_KEY:-}
      OPENCSIRT_CITADEL_API_URL: ${OPENCSIRT_CITADEL_API_URL:-}
      OPENCSIRT_CITADEL_HMAC_SECRETS: ${OPENCSIRT_CITADEL_HMAC_SECRETS:-}
      OPENCSIRT_CITADEL_DRY_RUN: ${OPENCSIRT_CITADEL_DRY_RUN:-true}
      OPENCSIRT_NIS2COMPASS_API_URL: ${OPENCSIRT_NIS2COMPASS_API_URL:-}
      OPENCSIRT_VERTGUARD_API_URL: ${OPENCSIRT_VERTGUARD_API_URL:-}
      OPENCSIRT_VERTGUARD_API_KEY: ${OPENCSIRT_VERTGUARD_API_KEY:-}
    networks:
      - internal
      - public

  web:
    build:
      context: web
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "${OPENCSIRT_WEB_PORT:-80}:80"
    networks:
      - public

volumes:
  opencsirt-pg:

networks:
  internal:
    driver: bridge
    internal: true
  public:
    driver: bridge
