[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "opencsirt-advisory"
version = "1.0.0"
description = "OpenCSIRT Python advisory subsystem — CSAF 2.0 generation, IOC enrichment, abuse-mailbox triage."
license = { text = "AGPL-3.0-or-later" }
requires-python = ">=3.11"
authors = [{ name = "OpenSecStack" }]
dependencies = [
  "fastapi>=0.111",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "httpx>=0.27",
  "pyjwt>=2.8",
  "yara-python>=4.5",
  "redis>=5.0",
  "python-dateutil>=2.9",
  "jsonschema>=4.22",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.23",
  "pytest-cov>=5",
  "respx>=0.21",
  "mypy>=1.10",
  "ruff>=0.5",
  "types-python-dateutil",
  "types-jsonschema",
]

[project.scripts]
opencsirt-advisory = "advisory.main:run"

[tool.setuptools.packages.find]
where = ["."]
include = ["advisory*"]

[tool.setuptools.package-data]
advisory = ["rules/*.yar", "schemas/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q --cov=advisory --cov-report=term-missing --cov-fail-under=80"

[tool.mypy]
strict = true
python_version = "3.11"
files = ["advisory"]
plugins = ["pydantic.mypy"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["yara", "redis.*"]
ignore_missing_imports = true

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "C4", "SIM", "RUF"]
ignore = ["E501"]  # line length handled by formatter

[tool.ruff.lint.per-file-ignores]
# Tests legitimately use blind exceptions (raise→PyJWT internals), the
# Depends(...) default pattern is the FastAPI idiom, and asserts are
# the assertion mechanism.
"tests/*" = ["B011", "S101", "B017", "B008"]
# Auth handler intentionally uses Depends(...) defaults — that's how
# FastAPI threads dependencies. Silencing B008 keeps the file readable.
"advisory/auth.py" = ["B008"]
"advisory/api.py" = ["B008"]
