apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "openscrub.fullname" . }}-api
  labels:
    {{- include "openscrub.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  replicas: {{ .Values.api.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "openscrub.name" . }}
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "openscrub.name" . }}
        app.kubernetes.io/component: api
    spec:
      containers:
        - name: api
          image: "{{ .Values.image.registry }}/{{ .Values.image.api.repository }}:{{ .Values.image.api.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.api.service.port }}
          env:
            - name: OPENSCRUB_HTTP_ADDR
              value: ":{{ .Values.api.service.port }}"
            - name: OPENSCRUB_DATAPLANE_TRANSPORT
              value: uds
            - name: OPENSCRUB_USERS
              valueFrom:
                secretKeyRef:
                  name: {{ default (printf "%s-secrets" (include "openscrub.fullname" .)) .Values.secrets.existingSecret }}
                  key: users
                  optional: true
            - name: OPENSCRUB_PASSWORD_PEPPER
              valueFrom:
                secretKeyRef:
                  name: {{ default (printf "%s-secrets" (include "openscrub.fullname" .)) .Values.secrets.existingSecret }}
                  key: passwordPepper
                  optional: true
            {{- $secret := default (printf "%s-secrets" (include "openscrub.fullname" .)) .Values.secrets.existingSecret }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $secret }}
                  key: postgresPassword
            - name: OPENSCRUB_DB_URL
              value: "postgres://{{ .Values.postgres.user }}:$(POSTGRES_PASSWORD)@{{ include "openscrub.fullname" . }}-postgres:5432/{{ .Values.postgres.database }}?sslmode=disable"
            - name: OPENSCRUB_DATAPLANE_SOCKET
              value: /run/openscrub/dataplane.sock
            - name: OPENSCRUB_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ $secret }}
                  key: jwtSecret
            - name: OPENSCRUB_THREATFLOW_API_URL
              value: {{ .Values.env.threatflowApiUrl | quote }}
            - name: OPENSCRUB_THREATFLOW_INTERVAL
              value: {{ .Values.env.threatflowInterval | default "15m" | quote }}
            - name: OPENSCRUB_THREATFLOW_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ $secret }}
                  key: threatflowToken
            - name: OPENSCRUB_CITADEL_API_URL
              value: {{ .Values.env.citadelApiUrl | quote }}
            - name: OPENSCRUB_CITADEL_HMAC_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ $secret }}
                  key: citadelHmacSecret
            - name: OPENSCRUB_CITADEL_HMAC_SECRETS
              valueFrom:
                secretKeyRef:
                  name: {{ $secret }}
                  key: citadelHmacSecrets
                  optional: true
            - name: OPENSCRUB_CITADEL_KEY_ID
              value: {{ .Values.env.citadelKeyId | default "" | quote }}
            - name: OPENSCRUB_CITADEL_KEY_IDS
              value: {{ .Values.env.citadelKeyIds | default "" | quote }}
            - name: OPENSCRUB_CITADEL_DRY_RUN
              value: {{ .Values.env.citadelDryRun | default "false" | quote }}
            - name: OPENSCRUB_NODE
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: OPENSCRUB_TOKEN_TTL
              value: {{ .Values.env.tokenTTL | default "1h" | quote }}
            - name: OPENSCRUB_MITIGATION_MIN_DURATION
              value: {{ .Values.env.mitigationMinDuration | default "5s" | quote }}
            - name: OPENSCRUB_DB_MAX_CONNS
              value: {{ .Values.env.dbMaxConns | default "16" | quote }}
            - name: OPENSCRUB_DEV_MODE
              value: {{ .Values.env.devMode | default "false" | quote }}
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: http
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: http
            initialDelaySeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "openscrub.fullname" . }}-api
  labels:
    {{- include "openscrub.labels" . | nindent 4 }}
spec:
  type: {{ .Values.api.service.type }}
  ports:
    - port: {{ .Values.api.service.port }}
      targetPort: http
      name: http
  selector:
    app.kubernetes.io/name: {{ include "openscrub.name" . }}
    app.kubernetes.io/component: api
