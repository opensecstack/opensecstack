{{- if not .Values.secrets.existingSecret }}
{{- if not .Values.secrets.generateOnInstall }}
{{- fail "secrets.existingSecret is empty and secrets.generateOnInstall is false — refusing to install without a Secret. Either pre-create a Secret and set secrets.existingSecret, or set secrets.generateOnInstall=true." }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "openscrub.fullname" . }}-secrets
  labels:
    {{- include "openscrub.labels" . | nindent 4 }}
  annotations:
    # Keep across helm uninstall so we don't accidentally rotate every
    # secret in the cluster on a re-install. Operator must delete the
    # Secret manually to rotate.
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  jwtSecret: {{ randAlphaNum 48 | quote }}
  postgresPassword: {{ randAlphaNum 32 | quote }}
  threatflowToken: ""
  citadelHmacSecret: {{ randAlphaNum 48 | quote }}
{{- end }}
