# Default values for the openscrub chart.

image:
  registry: ghcr.io/opensecstack
  pullPolicy: IfNotPresent
  api:
    repository: openscrub-api
    tag: "1.0.0"
  loader:
    # Crate name is `openscrub-dataplane`; the Docker image follows.
    repository: openscrub-dataplane
    tag: "1.0.0"
  web:
    repository: openscrub-web
    tag: "1.0.0"

api:
  replicas: 2
  resources:
    requests:
      cpu: "100m"
      memory: "128Mi"
    limits:
      cpu: "500m"
      memory: "512Mi"
  service:
    type: ClusterIP
    port: 8087
  # Prometheus metrics are served on the main HTTP port at
  # /api/v1/metrics (auth-gated). There is no separate metrics
  # listener — the previous `api.metrics.port` was a config artefact
  # that never had a backing listener in the Go binary.

loader:
  # The loader runs as a DaemonSet on every node that participates in
  # ingress filtering. We grant the minimum capability set instead of
  # privileged: true — kernel >= 5.8 supports CAP_BPF as a discrete cap,
  # which removes the need for CAP_SYS_ADMIN and lets us drop ALL by
  # default. privileged: true would also disable AppArmor/seccomp, so
  # we deliberately keep it false.
  hostNetwork: true
  hostPID: false
  capabilities:
    drop:
      - ALL
    add:
      - BPF
      - NET_ADMIN
      - SYS_RESOURCE
  # allowPrivilegeEscalation must stay false — caps come from the
  # securityContext, not from a setuid binary.
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  iface: "eth0"
  xdpMode: "drv"
  resources:
    requests:
      cpu: "50m"
      memory: "64Mi"
    limits:
      cpu: "200m"
      memory: "256Mi"
  nodeSelector:
    openscrub.opensecstack.org/edge: "true"
  tolerations: []

web:
  replicas: 1
  service:
    type: ClusterIP
    port: 80
  ingress:
    enabled: false
    host: openscrub.example.org
    tls: false

postgres:
  enabled: true
  image: postgres:16-alpine
  storage: 10Gi
  user: openscrub
  database: openscrub
  # Postgres password is *never* set in values.yaml. It is read from
  # an existing Secret. Either pass --set-string secrets.existingSecret=...
  # to point at a pre-provisioned Secret, or let the chart generate one
  # on first install (see templates/secrets.yaml).
  existingSecret: ""

# Non-secret env. Real secrets live in the Secret named by
# .Values.secrets.existingSecret (or the chart-generated one).
env:
  threatflowApiUrl: ""
  # Pull cadence — Go time.Duration string. Empty falls back to the
  # binary's compile-time default (15m).
  threatflowInterval: "15m"
  citadelApiUrl: ""

secrets:
  # If set, the chart references this pre-existing Secret and does
  # not generate one. The Secret MUST contain keys: jwtSecret,
  # postgresPassword, threatflowToken, citadelHmacSecret.
  existingSecret: ""
  # If existingSecret is empty, the chart generates random values on
  # first install and persists them via helm.sh/resource-policy: keep.
  # Helm upgrades will not regenerate them.
  generateOnInstall: true

serviceAccount:
  create: true
  name: ""

podSecurityContext: {}
securityContext: {}
