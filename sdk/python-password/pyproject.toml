[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "opensecstack-password"
version = "1.0.0"
description = "Argon2id + HMAC pepper password hasher — OpenSecStack reference implementation, sister to the Go sdk/go/password module"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
authors = [
    { name = "opensecstack contributors" },
]
keywords = ["argon2", "password", "hashing", "security", "opensecstack"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security :: Cryptography",
]
dependencies = [
    "argon2-cffi>=23.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "mypy>=1.0",
    "ruff>=0.4",
]

[project.urls]
Homepage = "https://github.com/opensecstack/opensecstack"
Repository = "https://github.com/opensecstack/opensecstack"
Issues = "https://github.com/opensecstack/opensecstack/issues"

[tool.hatch.build.targets.wheel]
packages = ["opensecstack_password"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
python_version = "3.10"
strict = true
