[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "opensecstack-sdk"
version = "0.1.0"
description = "Python client library for the opensecstack platform APIs (NIS2 Compass, APIGuard)"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
authors = [
    { name = "opensecstack contributors" },
]
keywords = ["nis2", "apiguard", "security", "compliance", "sdk"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "requests>=2.31",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-httpserver>=1.0",
    "responses>=0.25",
    "mypy>=1.0",
    "ruff>=0.4",
]

[project.urls]
Homepage = "https://github.com/opensecstack"
Repository = "https://github.com/opensecstack/opensecstack"
Issues = "https://github.com/opensecstack/opensecstack/issues"
Documentation = "https://opensecstack.github.io/opensecstack/"
Changelog = "https://github.com/opensecstack/opensecstack/blob/main/sdk/python/CHANGELOG.md"

[tool.hatch.version]
path = "opensecstack/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["opensecstack"]

[tool.setuptools.package-data]
opensecstack = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP"]

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true
