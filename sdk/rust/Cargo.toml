[package]
name = "opensecstack"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "Rust SDK for OpenSecStack — APIGuard and NIS2 Compass clients"
license = "Apache-2.0"
repository = "https://github.com/opensecstack/opensecstack"
keywords = ["api-security", "nis2", "owasp", "apiguard"]
categories = ["api-bindings", "network-programming"]

[features]
# Enable the axum-based webhook_receiver example.
axum = ["dep:axum", "dep:tracing-subscriber"]
tracing-subscriber = ["dep:tracing-subscriber"]
# Enable integration tests that require a live mock API server.
integration = []

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "stream", "rustls-tls"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
base64 = "0.22"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
bytes = "1"
futures-util = "0.3"
tracing = "0.1"
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
axum = { version = "0.7", optional = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"], optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
mockito = "1"
wiremock = "0.6"
tokio-test = "0.4"
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"

[[example]]
name = "scan_and_report"
path = "examples/scan_and_report.rs"

[[example]]
name = "nis2_assessment"
path = "examples/nis2_assessment.rs"

[[example]]
name = "webhook_receiver"
path = "examples/webhook_receiver.rs"
required-features = ["axum", "tracing-subscriber"]

[[example]]
name = "citadel_events"
path = "examples/citadel_events.rs"
