[package]
name = "citadel-kerkese-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "no_std + alloc core for building, signing, and submitting CITADEL MARSHAL Kerkese requests, for hosts (e.g. Runix's freestanding kernel) that can't pull in Tokio/reqwest. See opensecstack/opensecstack#34."
license = "Apache-2.0"
repository = "https://github.com/opensecstack/opensecstack"
keywords = ["citadel", "marshal", "no-std", "governance"]
categories = ["no-std", "no-std::no-alloc"]

[dependencies]
# All declared with default-features disabled + explicit `alloc`/no-`std`
# feature sets, and NOT via any workspace table — this crate must compile
# for a freestanding target (e.g. x86_64-unknown-none, see
# .cargo/config.toml) with no `std` at all, matching the pattern
# Runix's own capability-manager crate uses for the same reason (see
# runix/capability-manager/Cargo.toml, a read-only reference for this
# crate, not a dependency of it).
serde = { version = "1", default-features = false, features = ["alloc", "derive"] }
serde_json = { version = "1", default-features = false, features = ["alloc"] }
ed25519-dalek = { version = "2", default-features = false, features = ["alloc"] }
hex = { version = "0.4", default-features = false, features = ["alloc"] }
# Not used directly — pulled in transitively by ed25519-dalek for its
# internal SHA-512 hashing. Forces the portable scalar backend; see the
# identical note in runix/capability-manager/Cargo.toml for why the default
# build hits an LLVM codegen ICE on freestanding x86_64 targets.
sha2 = { version = "0.10", default-features = false, features = ["force-soft"] }

[dev-dependencies]
ed25519-dalek = { version = "2", default-features = false, features = ["alloc", "rand_core"] }
rand_core = { version = "0.6", features = ["getrandom"] }

[lib]
name = "citadel_kerkese_core"
