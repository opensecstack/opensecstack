version: "3.9"
services:
  mock-api:
    image: mockoon/cli:latest
    volumes:
      - ./mockoon-env.json:/data/mockoon-env.json:ro
    command: ["--data", "/data/mockoon-env.json", "--port", "3000"]
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:3000/api/v1/health"]
      interval: 5s
      timeout: 3s
      retries: 10
