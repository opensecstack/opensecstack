[package]
name = "vantage-hash"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "TripleHash — BLAKE3 + SHA-256 + SHA-512 composite digest for opensecstack/CITADEL"
license = "Apache-2.0"
repository = "https://github.com/opensecstack/opensecstack"
keywords = ["blake3", "sha256", "sha512", "cryptography", "triplehash"]
categories = ["cryptography", "no-std"]

[dependencies]
blake3  = "1"
sha2    = "0.10"
hex     = "0.4"
serde   = { version = "1", features = ["derive"] }

[dev-dependencies]
criterion   = { version = "0.5", features = ["html_reports"] }
serde_json  = "1"
sha2        = "0.10"      # used in integration tests to cross-check components
blake3      = "1"

[[bench]]
name    = "hash_bench"
harness = false
