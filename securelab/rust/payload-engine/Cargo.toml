[package]
name = "securelab-payload-engine"
version = "1.0.0"
edition = "2021"

[lib]
name = "payload_engine"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.21", features = ["extension-module"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tracing = "0.1"

[dev-dependencies]
# pyo3 testing via pytest (see maturin / pytest-benchmark)
