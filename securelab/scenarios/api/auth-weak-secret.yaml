name: auth-weak-secret
description: "JWT weak secret brute force — attempt to forge valid tokens using a common-secret wordlist"
mitre_technique_ids: ["T1110.001"]
tags: [api, owasp-a2, jwt, brute-force]
severity: high
timeout: 2m
steps:
  - kind: jwt_brute
    params:
      endpoint: /api/v1/admin/users
      wordlist:
        - secret
        - password
        - 12345
        - jwt_secret
        - changeme
        - supersecret
        - mysecret
      algorithm: HS256
      claims_template:
        sub: "1"
        role: admin
      success_indicator:
        status_code: 200
