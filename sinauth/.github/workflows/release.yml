name: Release
on:
  push:
    tags: ['v*']

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - name: Build
        run: |
          VERSION=${GITHUB_REF_NAME}
          COMMIT=$(git rev-parse --short HEAD)
          DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build \
            -ldflags="-X github.com/opensecstack/sinauth/internal/version.Version=${VERSION} \
                      -X github.com/opensecstack/sinauth/internal/version.Commit=${COMMIT} \
                      -X github.com/opensecstack/sinauth/internal/version.Date=${DATE}" \
            -o sinauth-linux-amd64 ./cmd/sinauth
      - name: Docker Build & Push
        run: |
          docker build -t ghcr.io/opensecstack/sinauth:${GITHUB_REF_NAME} .
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          docker push ghcr.io/opensecstack/sinauth:${GITHUB_REF_NAME}
