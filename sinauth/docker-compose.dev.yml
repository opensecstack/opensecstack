services:
  sinauth:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "8100:8100"
    environment:
      SINAUTH_HTTP_ADDR:        ":8100"
      SINAUTH_DEV_MODE:         "true"
      SINAUTH_DB_URL:           "postgres://sinauth:sinauth@postgres:5432/sinauth?sslmode=disable"
      SINAUTH_ISSUER:           "http://localhost:8100"
      SINAUTH_SITE_URL:         "http://localhost:5174"
      SINAUTH_SIGNING_KEY_PATH: "/app/dev-keys/sinauth.pem"
      SINAUTH_SIGNING_KEY_ID:   "dev-1"
      # Social OAuth — export these in your shell to enable Google/GitHub login
      # locally. Redirect URIs auto-derive from SINAUTH_ISSUER, so register
      # http://localhost:8100/api/v1/auth/google/callback (and .../github/callback)
      # in the Google / GitHub OAuth app consoles.
      GOOGLE_CLIENT_ID:         "${GOOGLE_CLIENT_ID:-}"
      GOOGLE_CLIENT_SECRET:     "${GOOGLE_CLIENT_SECRET:-}"
      GITHUB_CLIENT_ID:         "${GITHUB_CLIENT_ID:-}"
      GITHUB_CLIENT_SECRET:     "${GITHUB_CLIENT_SECRET:-}"
      # Permify (authorization engine) — unset (default) falls back to
      # authz.NoopChecker (fail-open, no per-resource gate), same pattern as
      # SMS/Twilio above. Point at the permify service below to exercise the
      # real Checker locally.
      SINAUTH_PERMIFY_URL:      "permify:3478"
      SINAUTH_PERMIFY_TIMEOUT:  "3s"
    volumes:
      - .:/app
      - ./dev-keys:/app/dev-keys
    depends_on:
      - postgres
      - permify

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB:       sinauth
      POSTGRES_USER:     sinauth
      POSTGRES_PASSWORD: sinauth
    ports:
      - "5433:5432"

  # Permify (https://permify.co) — Zanzibar-style ReBAC/RBAC engine backing
  # sinauth's authz.Checker (see internal/authz, sinauth/permify/schema.perm,
  # sinauth/adrs/006-permify-authorization-engine.md). Runs with its own
  # in-memory store for local dev: this is Permify's own tuple/schema
  # storage, kept independent of sinauth's Postgres, and simplest for a dev
  # loop where the schema/tuples are just rewritten/backfilled on restart.
  permify:
    image: ghcr.io/permify/permify:latest
    command: ["serve", "--database-engine", "memory"]
    ports:
      - "3478:3478" # gRPC
      - "3476:3476" # HTTP/REST
    healthcheck:
      test: ["CMD", "grpc_health_probe", "-addr=localhost:3478"]
      interval: 5s
      timeout: 5s
      retries: 5
