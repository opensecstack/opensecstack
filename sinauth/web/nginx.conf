upstream sinauth_api { server sinauth-api:8100; }

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # ── Backend (sinauth API) ──────────────────────────────────────────────────
  # Only proxy the paths the backend actually owns. Everything else (including
  # SPA admin pages like /admin/users) falls through to the React app below.
  location /api/                { proxy_pass http://sinauth_api; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; }
  location /.well-known/        { proxy_pass http://sinauth_api; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; }
  location /federation/         { proxy_pass http://sinauth_api; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; }
  location /admin/rbac/         { proxy_pass http://sinauth_api; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; }
  location /admin/federation/   { proxy_pass http://sinauth_api; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; }
  location = /oauth/authorize   { proxy_pass http://sinauth_api; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; }
  location = /oauth/userinfo    { proxy_pass http://sinauth_api; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; }
  location = /oauth/endsession  { proxy_pass http://sinauth_api; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; }
  location /oauth/token         { proxy_pass http://sinauth_api; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; }

  # ── SPA (React Router): /, /login, /oauth/login, /oauth/consent, /admin/* ───
  location / {
    try_files $uri $uri/ /index.html;
  }
}
