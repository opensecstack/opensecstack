version: "2"
run:
  modules-download-mode: readonly
linters:
  enable:
    - bodyclose
    - gosec
    - misspell
    - noctx
    - prealloc
  settings:
    errcheck:
      check-type-assertions: true
    gosec:
      excludes:
        - G104
    govet:
      disable:
        - shadow
        - fieldalignment
      enable-all: true
    misspell:
      locale: US
      ignore-rules:
        - mitre
        - cancelled
        - summarises
        - summarise
        - materialise
        - catalogue
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
          - errcheck
          - gosec
        path: _test\.go
      - linters:
          - errcheck
        path: cmd/
    paths:
      - third_party$
      - builtin$
      - examples$
formatters:
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
