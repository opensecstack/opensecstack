version: "3.9"

services:
  threatflow-api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8091:8091"
    environment:
      THREATFLOW_PORT: "8091"
      THREATFLOW_DB_URL: "postgres://threatflow:threatflow@postgres:5432/threatflow?sslmode=disable"
      THREATFLOW_LOG_LEVEL: "debug"
      THREATFLOW_LOG_FORMAT: "text"
      THREATFLOW_CITADEL_API_URL: ""
    volumes:
      - .:/src:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - backend

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: threatflow
      POSTGRES_PASSWORD: threatflow
      POSTGRES_DB: threatflow
    ports:
      - "5432:5432"
    volumes:
      - pgdata-dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U threatflow"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - backend

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: ["redis-server", "--maxmemory", "64mb", "--maxmemory-policy", "allkeys-lru"]
    networks:
      - backend

volumes:
  pgdata-dev:

networks:
  backend:
    driver: bridge
