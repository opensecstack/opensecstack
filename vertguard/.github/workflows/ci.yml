name: VertGuard CI

on:
  push:
    branches: [main]
    paths:
      - 'vertguard/**'
      - '.github/workflows/ci.yml'
  pull_request:
    paths:
      - 'vertguard/**'

permissions:
  contents: read

jobs:
  go-test:
    name: Go test + lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vertguard
    steps:
      - uses: actions/checkout@v4
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache-dependency-path: vertguard/go.sum
      - name: Download deps
        run: go mod download
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Unit tests
        run: go test -race -count=1 ./...

  go-mod-tidy:
    # Closes security-checklist gap 7.3.
    # Ensures go.mod and go.sum are always tidy: no phantom dependencies,
    # no missing sums, no indirect entries that silently drift from reality.
    # Any contributor who forgets `go mod tidy` before pushing will see a
    # clear diff here rather than a mysterious build failure downstream.
    name: go mod tidy check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vertguard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache-dependency-path: vertguard/go.sum
      - name: Check go.mod is tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

  go-lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vertguard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache-dependency-path: vertguard/go.sum
      - uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          working-directory: vertguard

  go-security:
    name: Go security gates (gosec/govulncheck/staticcheck)
    runs-on: ubuntu-latest
    needs: go-test
    defaults:
      run:
        working-directory: vertguard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache-dependency-path: vertguard/go.sum
      - name: Install scanners
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@latest
          go install golang.org/x/vuln/cmd/govulncheck@latest
          go install honnef.co/go/tools/cmd/staticcheck@latest
      # Run via the Makefile so the local `make sec-go` and CI use the
      # same flags — divergence between the two is the usual reason
      # "passed locally" PRs fail in CI.
      - run: make sec-go

  rust-test:
    name: Rust test + clippy
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vertguard/rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: vertguard/rust
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Test
        run: cargo test --workspace

  rust-security:
    name: Rust security gates (cargo audit + cargo deny)
    runs-on: ubuntu-latest
    needs: rust-test
    defaults:
      run:
        working-directory: vertguard
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: vertguard/rust
      - run: cargo install cargo-audit --locked
      - run: cargo install cargo-deny --locked
      - run: make sec-rust

  go-integration-postgres:
    name: Go -tags integration (Postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: vertguard
          POSTGRES_PASSWORD: vertguard
          POSTGRES_DB: vertguard
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U vertguard"
          --health-interval 5s --health-timeout 3s --health-retries 12
    env:
      VERTGUARD_TEST_DB_URL: postgres://vertguard:vertguard@127.0.0.1:5432/vertguard?sslmode=disable
    defaults:
      run:
        working-directory: vertguard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache-dependency-path: vertguard/go.sum
      - name: Apply migrations
        run: |
          go install -tags 'postgres' github.com/golang-migrate/migrate/v4/cmd/migrate@latest
          migrate -path ./internal/db/migrations -database "$VERTGUARD_TEST_DB_URL" up
      - run: make test-postgres

  c2pa-verify:
    name: c2pa-verify (Linux build)
    # Dedicated job because c2pa-rs with `openssl_sign` pulls in heavy
    # native deps. Linux + libssl-dev links cleanly; MinGW-w64 on Windows
    # currently does not (tracked as a known limitation — see
    # rust/c2pa-verify/README.md). Kept parallel to `rust-test` so a
    # MinGW/openssl flake here does not block the rest of the matrix.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev pkg-config build-essential
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: vertguard/rust
          key: c2pa-verify
      - name: Build (release)
        run: cargo build --release --manifest-path vertguard/rust/c2pa-verify/Cargo.toml
      - name: Test
        run: cargo test --manifest-path vertguard/rust/c2pa-verify/Cargo.toml
      - name: Clippy
        # Non-fatal: c2pa-rs 0.30 transitively triggers a few lints we
        # don't control. Promote to `-D warnings` once the crate is
        # warning-clean on the upstream version we pin.
        continue-on-error: true
        run: cargo clippy --manifest-path vertguard/rust/c2pa-verify/Cargo.toml -- -D warnings

  openapi-check:
    name: OpenAPI spec + TS client drift check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Verify api-generated.ts matches openapi.yaml
        working-directory: vertguard
        run: bash api/scripts/gen-ts-client.sh --check

  web:
    name: Web build + lint + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: vertguard/web/package-lock.json
      - run: cd vertguard/web && npm ci
      - run: cd vertguard/web && npm run lint
      - run: cd vertguard/web && npm run typecheck
      - run: cd vertguard/web && npm test
      - run: cd vertguard/web && npm run build

  docker-build:
    name: Docker build smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        working-directory: vertguard
        run: docker build -t vertguard:ci .
