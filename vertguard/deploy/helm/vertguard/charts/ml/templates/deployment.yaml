apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "vertguard-ml.fullname" . }}
  labels:
    {{- include "vertguard-ml.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  strategy:
    # WHY maxUnavailable=0: a missing ML pod degrades scan recall
    # silently (Go side falls back to regex-only). A surge keeps the
    # rollout invisible to scan latency.
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      {{- include "vertguard-ml.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "vertguard-ml.selectorLabels" . | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- if not .Values.metrics.serviceMonitor.enabled }}
        prometheus.io/scrape: "true"
        prometheus.io/port: "{{ .Values.metrics.port }}"
        prometheus.io/path: "/metrics"
        {{- end }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- include "vertguard-ml.imagePullSecrets" . | nindent 6 }}
      serviceAccountName: {{ include "vertguard-ml.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: vertguard-ml
          image: {{ include "vertguard-ml.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          ports:
            - name: grpc
              containerPort: {{ .Values.service.port }}
              protocol: TCP
            - name: metrics
              containerPort: {{ .Values.metrics.port }}
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "vertguard-ml.fullname" . }}-config
            {{- with .Values.extraEnvFrom }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          env:
            {{- if or .Values.secret.create .Values.secret.existingSecret }}
            - name: VERTGUARD_ML_REGISTRY_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "vertguard-ml.secretName" . }}
                  key: registry-access-key
                  optional: true
            - name: VERTGUARD_ML_REGISTRY_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "vertguard-ml.secretName" . }}
                  key: registry-secret-key
                  optional: true
            {{- end }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          livenessProbe:
            exec:
              command:
                - /usr/local/bin/grpc_health_probe
                - -addr=127.0.0.1:{{ .Values.service.port }}
            initialDelaySeconds: {{ .Values.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.liveness.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.liveness.failureThreshold }}
          readinessProbe:
            exec:
              command:
                - /usr/local/bin/grpc_health_probe
                - -addr=127.0.0.1:{{ .Values.service.port }}
            initialDelaySeconds: {{ .Values.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.readiness.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.readiness.failureThreshold }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: models
              mountPath: {{ .Values.config.models_path }}
              {{- if not .Values.persistence.enabled }}
              # readOnlyRootFilesystem requires writable mount even for
              # ephemeral model cache directories.
              {{- end }}
      volumes:
        - name: tmp
          emptyDir: {}
        - name: models
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "vertguard-ml.fullname" . }}-models
          {{- else }}
          emptyDir:
            sizeLimit: 5Gi
          {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
