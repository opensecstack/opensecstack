{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "vertguard-ml.fullname" . }}
  labels:
    {{- include "vertguard-ml.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "vertguard-ml.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # gRPC from the parent VertGuard pods only.
    - from:
        - podSelector:
            matchLabels:
              {{- toYaml .Values.networkPolicy.parent.matchLabels | nindent 14 }}
      ports:
        - protocol: TCP
          port: {{ .Values.service.port }}
    {{- if .Values.networkPolicy.prometheusNamespace }}
    # Prometheus scrape from the monitoring namespace.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.prometheusNamespace | quote }}
      ports:
        - protocol: TCP
          port: {{ .Values.metrics.port }}
    {{- end }}
  egress:
    # DNS — required for cluster service resolution.
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # Model registry egress on HTTPS. The registry endpoint is
    # configured via VERTGUARD_ML_REGISTRY_URL; pin its CIDR or DNS
    # via a CNI-specific FQDN policy where supported.
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: 443
{{- end }}
