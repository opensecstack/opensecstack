{{- if .Values.podDisruptionBudget.enabled }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "vertguard-ml.fullname" . }}
  labels:
    {{- include "vertguard-ml.labels" . | nindent 4 }}
spec:
  minAvailable: {{ .Values.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels:
      {{- include "vertguard-ml.selectorLabels" . | nindent 6 }}
{{- end }}
