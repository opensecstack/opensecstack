# 3-class prompt-injection classifier (CLEAN / SUSPICIOUS / BLOCKED).
model:
  name: distilbert-base-uncased
  num_labels: 3
train:
  lr: 2e-5
  batch_size: 16
  epochs: 3
  weight_decay: 0.01
  max_seq_len: 256
  warmup_ratio: 0.1
data:
  corpus_path: ../../internal/prompt/corpus/corpus.jsonl
  augment_factor: 2
