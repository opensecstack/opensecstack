model_type: isolation_forest
output_dir: /var/lib/vertguard/models/identity-gan
features:
  - email_domain_is_disposable
  - id_format_invalid
  - dob_missing
  - replay_count_norm
  - name_token_count_norm
  - country_risk
  - context_risk
  - claim_type_risk
training:
  n_estimators: 100
  contamination: 0.1
  max_samples: auto
  random_state: 42
country_risk_scores:
  default: 0.5
  # populated from FATF grey/black list + EU high-risk countries
datasets:
  - name: synthetic_identity_fraud
    path: data/identity/synthetic_fraud
  - name: kyc_benign_baseline
    path: data/identity/kyc_baseline
eval:
  metrics: [auc_roc, precision_at_k, recall_at_k]
  threshold: 0.55
