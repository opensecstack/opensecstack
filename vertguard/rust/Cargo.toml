[workspace]
resolver = "2"
members = [
    "prompt-patterns",
    "c2pa",
    "c2pa-verify",
    "audio-fingerprint",
    "triple-hash",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"
authors = ["OpenSecStack Contributors"]
repository = "https://github.com/opensecstack/opensecstack"
readme = "../README.md"

[workspace.dependencies]
# Pinned at workspace level so every crate uses identical versions.
regex = "1.10"
aho-corasick = "1.1"
thiserror = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
