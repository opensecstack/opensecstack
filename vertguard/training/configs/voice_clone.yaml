model_type: gradient_boosting
output_dir: /var/lib/vertguard/models/voice-clone
features:
  - voice_detected
  - duration_sec
  - mfcc_hash_norm
  - spectral_hash_norm
datasets:
  - name: asvspoof2019
    path: data/audio/asvspoof2019
  - name: vctk_synthesis
    path: data/audio/vctk_synthesis
eval:
  metrics: [eer, auc_roc, f1]
  threshold: 0.55
