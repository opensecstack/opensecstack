  <link rel="canonical" href="https://opensecstack.github.io/opensecstack/" />
  <meta property="og:url" content="https://opensecstack.github.io/opensecstack/" />
  <meta property="og:type" content="website" />

  <meta property="og:description" content="APIGuard, NIS2 Compass, and CITADEL governance engine — open-source tools for EU Digital Decade compliance." />
  <meta name="twitter:card" content="summary" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@graph": [
      {
        "@type": "Organization",
        "name": "opensecstack",
        "alternateName": "SIN — Security Intelligence Network",
        "url": "https://opensecstack.github.io/opensecstack/",
        "logo": "https://opensecstack.github.io/opensecstack/favicon.svg",
        "description": "Open-source cybersecurity ecosystem for Europe and beyond: 11 integrated security platforms, a single sign-on identity layer (sinauth), and a cryptographic governance layer (CITADEL), connected through typed SDK contracts.",

          "https://github.com/opensecstack/opensecstack"
        ]
      },
      {
        "@type": "WebSite",
        "name": "opensecstack",
        "url": "https://opensecstack.github.io/opensecstack/",

      }
    ]
  }
